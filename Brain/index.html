<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Marcel AI | Brain</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#080b10;color:#f5f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.platform{min-height:100dvh;display:grid;grid-template-columns:176px 1fr}.rail{height:100dvh;position:sticky;top:0;padding:22px 13px;background:#0c1117;border-right:1px solid #252a32;display:flex;flex-direction:column}.brand{padding:5px 9px 22px;font-weight:900}.brand span{color:#41c965}.nav{display:grid;gap:4px}.nav a{padding:10px 11px;border-radius:9px;text-decoration:none;color:#9ba3ad;font-size:14px;font-weight:650}.nav a:hover,.nav a.active{color:#fff;background:#211a31}.nav a.active{box-shadow:inset 3px 0 #a878ff}.nav-secondary{margin-top:auto;padding-top:18px;border-top:1px solid #252a32}.toggle{display:none}.main{padding:28px;min-width:0}.wrap{max-width:1180px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.header h1{margin:0 0 5px;font-size:28px}.muted{color:#9299a4;font-size:13px}.tools{display:flex;gap:9px}.control{border:1px solid #303541;background:#141922;color:#fff;border-radius:9px;padding:10px 12px}.search{width:min(300px,35vw)}button{border:0;border-radius:9px;padding:10px 13px;font-weight:750;background:#a878ff;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.tabs{display:flex;gap:6px;border-bottom:1px solid #292e38;margin-bottom:18px}.tab{background:transparent;color:#979eaa;border-radius:8px 8px 0 0}.tab.active{color:#fff;background:#211a31}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card,.state{border:1px solid #2b303a;background:#11161e;border-radius:14px;padding:16px}.card.review{border-color:#674d92}.card h3{font-size:13px;margin:0 0 8px}.value{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.meta{color:#858d98;font-size:11px;margin-top:10px}.verified{color:#66d885}.pending{color:#d2aa69}.state{line-height:1.8}.empty{padding:34px;text-align:center;color:#9299a4;border:1px dashed #363b46;border-radius:14px}.review-actions{margin-top:12px}.review-actions button{padding:7px 9px;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.dialog{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#131820;border:1px solid #393f4b;border-radius:14px;padding:20px}.dialog h2{margin-top:0}.dialog textarea{width:100%;min-height:100px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}.secondary{background:#29303a}.reject{background:#7b3039}.correct{background:#365f86}.notice{padding:10px;border-radius:8px;background:#251e31;color:#d9c8f5;font-size:12px;margin-top:10px}.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kind button.active{outline:2px solid #cfb2ff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;color:#aeb4bd;font-size:12px}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{border:1px solid #303541;background:#141922;color:#fff;border-radius:9px;padding:10px;width:100%}.check{display:flex;align-items:center;gap:8px;grid-column:1/-1;color:#d7dbe0;font-size:13px}.check input{width:auto}.conflict{border:1px solid #775b36;background:#2a2117;border-radius:10px;padding:12px;margin-top:12px}.conflict pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#f0d8b4}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.platform{grid-template-columns:1fr}.rail{height:auto;z-index:5;padding:10px 14px;display:grid;grid-template-columns:1fr auto}.brand{padding:7px}.toggle{display:block;background:#181e27}.nav{display:none;grid-column:1/-1;padding-top:8px}.rail.open .nav{display:grid}.nav-secondary{margin-top:8px}.main{padding:18px}.header{align-items:flex-start;flex-direction:column}.tools{width:100%;flex-wrap:wrap}.search{width:100%;flex:1}.grid,.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.tabs{overflow:auto}}
    .rail{min-width:0;overflow:hidden}.nav{min-width:0}.nav a{display:block;width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis}.nav-secondary{display:grid;gap:4px}
  </style>
</head>
<body>
<div class="platform">
  <aside class="rail"><div class="brand">MARCEL <span>AI</span></div><button class="toggle">Menü</button><nav class="nav"><a href="/Hub/">Hub</a><a href="/Dashboard/">WhatsApp</a><a href="/Tinder/">Tinder</a><a href="/Instagram/">Instagram</a><a href="/X/">X (Twitter)</a><a class="active" href="/Brain/">Brain</a><a href="/Trading/">Trading</a><div class="nav-secondary"><a href="/Kontakte/">Kontakte</a><a href="/Analyse/">Analyse</a><a href="/Einstellungen/">Einstellungen</a></div></nav></aside>
  <main class="main"><div class="wrap">
    <header class="header"><div><h1>Brain</h1><div class="muted">Marcels eigenes Wissen und aktueller Zustand</div></div><div class="tools"><input class="control search" id="search" type="search" placeholder="Brain durchsuchen"><button id="add">＋ Neuer Eintrag</button></div></header>
    <div class="tabs"><button class="tab active" data-tab="knowledge">Mein Wissen</button><button class="tab" data-tab="state">Aktueller Zustand</button><button class="tab" data-tab="review">Vorschläge &amp; Review</button></div>
    <section class="panel active" id="knowledge"><div class="grid" id="knowledgeGrid"><div class="empty">Brain wird geladen …</div></div></section>
    <section class="panel" id="state"><div id="stateBox" class="state">Zustand wird geladen …</div></section>
    <section class="panel" id="review"><div class="grid" id="reviewGrid"></div></section>
  </div></main>
</div>

<div class="modal" id="writeModal"><div class="dialog">
  <h2>Neuer Brain-Eintrag</h2>
  <div class="kind"><button id="factKind" class="active">Dauerhafter Fakt</button><button id="stateKind" class="secondary">Aktueller Zustand</button></div>
  <div id="factForm" class="form-grid">
    <label class="field">Kategorie<select id="factCategory"><option>identity</option><option>languages</option><option>work</option><option>family</option><option>communication</option><option>lifestyle</option><option>preferences</option><option>health</option><option>travel</option><option>finance</option><option>housing</option></select></label>
    <label class="field">Key<input id="factKey" placeholder="z. B. favorite_place"></label>
    <label class="field wide">Wert (Text oder gültiges JSON)<textarea id="factValue" placeholder="Fakt eingeben"></textarea></label>
    <label class="field">Importance<select id="factImportance"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
    <label class="field">Gültig bis<input id="factValidUntil" type="datetime-local"></label>
    <label class="check"><input id="factUseInReply" type="checkbox" checked> Für Antworten verwenden</label>
    <label class="field wide">Notiz<input id="factNotes" maxlength="1000"></label>
  </div>
  <div id="stateForm" hidden>
    <label class="field">Feld<select id="stateField"><option value="current_country">Aktuelles Land</option><option value="current_city">Aktuelle Stadt</option><option value="current_timezone">Zeitzone</option><option value="location_status">Ortsstatus</option><option value="relocation_target_country">Umzugs-Zielland</option><option value="relocation_target_city">Umzugs-Zielstadt</option><option value="relocation_stage">Umzugsphase</option><option value="relocation_eta">Umzugszeitraum</option><option value="temporary_travel_country">Temporäres Reiseland</option><option value="temporary_travel_city">Temporäre Reisestadt</option><option value="temporary_travel_until">Temporär bis</option><option value="housing_stage">Wohnstatus</option><option value="manual_location_lock">Manuelle Ortssperre</option></select></label>
    <label class="field" style="margin-top:10px">Wert<input id="stateValue"></label>
  </div>
  <div id="writeResult"></div><div id="conflictBox"></div>
  <div class="dialog-actions"><button class="secondary" id="writeClose">Abbrechen</button><button id="writeSave">Speichern</button></div>
</div></div>

<div class="modal" id="reviewModal"><div class="dialog"><h2 id="reviewTitle">Brain-Eintrag</h2><div id="reviewValue"></div><textarea class="control" id="correction" placeholder="Korrektur auf Deutsch"></textarea><div id="reviewResult"></div><div class="dialog-actions"><button class="secondary" id="reviewClose">Abbrechen</button><button class="reject" id="reject">Ablehnen</button><button class="correct" id="correct">Korrigieren</button><button id="confirm">Bestätigen</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
let brain={items:[]},selected=null,writeKind="fact",conflict=null;
const label=item=>item.labelDe||item.label||item.key||"Fakt";
const valueOf=item=>item.displayValueDe||item.valueDe||(item.value??"—");

async function request(url,options={}){
  const response=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{})},...options});
  if(response.status===401){location.href="/login.html";throw Error("Sitzung abgelaufen.")}
  const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{throw Error("Ungültige API-Antwort.")}
  if(!response.ok){const error=Error(data.error||"Brain konnte nicht aktualisiert werden.");error.status=response.status;error.data=data;throw error}
  return data;
}
async function load(){brain=await request("/api/dashboard/marcel-brain");render()}
function card(item,review=false){const shown=valueOf(item);return `<article class="card ${review?"review":""}"><h3>${item.humanVerified?'<span class="verified">✓ Bestätigt</span>':'<span class="pending">◇ Prüfung offen</span>'} · ${esc(label(item))}</h3><div class="value">${esc(typeof shown==="object"?JSON.stringify(shown):shown)}</div><div class="meta">${esc(item.category||"Wissen")} · Wichtigkeit ${Number(item.importance)||0}${item.sourceType?" · "+esc(item.sourceType):""}</div>${review?`<div class="review-actions"><button data-review-id="${esc(item.id)}">Prüfen</button></div>`:""}</article>`}
function render(){const q=$("search").value.trim().toLowerCase(),items=(brain.items||[]).filter(item=>(label(item)+" "+JSON.stringify(valueOf(item))).toLowerCase().includes(q));$("knowledgeGrid").innerHTML=items.length?items.map(item=>card(item)).join(""):'<div class="empty">Keine passenden Einträge.</div>';const open=items.filter(item=>!item.humanVerified);$("reviewGrid").innerHTML=open.length?open.map(item=>card(item,true)).join(""):'<div class="empty">Keine offenen Vorschläge.</div>';const state=brain.liveState||{};$("stateBox").innerHTML=Object.keys(state).length?Object.entries(state).filter(([key])=>!["id","updated_by"].includes(key)).map(([key,value])=>`<div><b>${esc(key.replaceAll("_"," "))}:</b> ${esc(value??"—")}</div>`).join(""):'<div class="empty">Kein aktueller Zustand gespeichert.</div>'}
function parseFactValue(raw){const text=raw.trim();if(!text)throw Error("Bitte einen Wert eingeben.");if(/^[\[{"\d]|^(true|false|null)$/i.test(text)){try{return JSON.parse(text)}catch{}}return text}
function factPayload(){const payload={category:$("factCategory").value,key:$("factKey").value.trim(),value:parseFactValue($("factValue").value),importance:Number($("factImportance").value),use_in_reply:$("factUseInReply").checked};if($("factValidUntil").value)payload.valid_until=new Date($("factValidUntil").value).toISOString();if($("factNotes").value.trim())payload.notes=$("factNotes").value.trim();return payload}
function statePayload(){const field=$("stateField").value,raw=$("stateValue").value.trim();let value=raw;if(field==="manual_location_lock"){if(!["true","false"].includes(raw.toLowerCase()))throw Error("Bitte true oder false eingeben.");value=raw.toLowerCase()==="true"}if(field==="temporary_travel_until"&&raw)value=new Date(raw).toISOString();return {[field]:value||null}}
function setKind(kind){writeKind=kind;$("factForm").hidden=kind!=="fact";$("stateForm").hidden=kind!=="state";$("factKind").classList.toggle("active",kind==="fact");$("stateKind").classList.toggle("active",kind==="state");$("conflictBox").innerHTML="";conflict=null}
async function saveWrite(){const button=$("writeSave");button.disabled=true;$("writeResult").innerHTML='<div class="notice">Wird gespeichert …</div>';$("conflictBox").innerHTML="";try{if(writeKind==="state"){await request("/api/dashboard/marcel-brain/live-state",{method:"PATCH",body:JSON.stringify(statePayload())})}else{await request("/api/dashboard/marcel-brain/facts",{method:"POST",body:JSON.stringify(factPayload())})}$("writeModal").classList.remove("open");await load()}catch(error){if(error.status===409&&error.data?.existing){conflict={existing:error.data.existing,proposed:error.data.proposed};$("writeResult").innerHTML="";$("conflictBox").innerHTML=`<div class="conflict"><b>Dieser Key besitzt bereits einen anderen Wert.</b><p>Bestehend:</p><pre>${esc(JSON.stringify(conflict.existing.value,null,2))}</pre><p>Neu:</p><pre>${esc(JSON.stringify(conflict.proposed.value,null,2))}</pre><button id="confirmUpdate">Änderung bewusst bestätigen</button></div>`;$("confirmUpdate").onclick=confirmConflict}else{$("writeResult").innerHTML=`<div class="notice">${esc(error.message)}</div>`}}finally{button.disabled=false}}
async function confirmConflict(){if(!conflict)return;const button=$("confirmUpdate");button.disabled=true;try{await request(`/api/dashboard/marcel-brain/facts?id=${encodeURIComponent(conflict.existing.id)}`,{method:"PATCH",body:JSON.stringify({...conflict.proposed,expectedUpdatedAt:conflict.existing.updatedAt,explicitConflictConfirmation:true})});$("writeModal").classList.remove("open");await load()}catch(error){$("writeResult").innerHTML=`<div class="notice">${esc(error.message)}</div>`;button.disabled=false}}
function openReview(id){selected=(brain.items||[]).find(item=>String(item.id)===String(id));if(!selected)return;$("reviewTitle").textContent=label(selected);const shown=valueOf(selected);$("reviewValue").textContent=typeof shown==="object"?JSON.stringify(shown):shown;$("correction").value="";$("reviewResult").innerHTML="";$("reviewModal").classList.add("open")}
async function review(action){if(!selected)return;const correctionDe=$("correction").value.trim();if(action==="correct"&&!correctionDe){$("reviewResult").innerHTML='<div class="notice">Bitte die richtige Information eingeben.</div>';return}try{await request("/api/dashboard/marcel-brain",{method:"POST",body:JSON.stringify({memoryId:Number(selected.id),action,correctionDe})});$("reviewModal").classList.remove("open");await load()}catch(error){$("reviewResult").innerHTML=`<div class="notice">${esc(error.message)}</div>`}}

document.querySelectorAll(".tab").forEach(button=>button.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(node=>node.classList.remove("active"));button.classList.add("active");$(button.dataset.tab).classList.add("active")});
$("search").oninput=render;$("add").onclick=()=>{$("writeResult").innerHTML="";$("conflictBox").innerHTML="";setKind("fact");$("writeModal").classList.add("open")};$("factKind").onclick=()=>setKind("fact");$("stateKind").onclick=()=>setKind("state");$("writeClose").onclick=()=>$("writeModal").classList.remove("open");$("writeSave").onclick=saveWrite;
$("reviewGrid").onclick=event=>{const button=event.target.closest("[data-review-id]");if(button)openReview(button.dataset.reviewId)};$("reviewClose").onclick=()=>$("reviewModal").classList.remove("open");$("confirm").onclick=()=>review("confirm");$("reject").onclick=()=>review("reject");$("correct").onclick=()=>review("correct");document.querySelector(".toggle").onclick=()=>document.querySelector(".rail").classList.toggle("open");
load().catch(error=>$("knowledgeGrid").innerHTML=`<div class="empty">${esc(error.message)}</div>`);
</script>
</body>
</html>
