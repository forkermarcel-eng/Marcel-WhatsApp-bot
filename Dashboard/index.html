<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1015">

  <title>Marcel AI Dashboard</title>

  <style>
    :root {
      --bg: #090d11;
      --panel: #0d1217;
      --panel-2: #10161c;
      --panel-3: #171e25;
      --panel-hover: #202830;
      --border: #293139;

      --text: #f5f7f8;
      --muted: #98a2ab;

      --green: #31b457;
      --green-2: #43cc67;
      --green-dark: #1e7d3a;

      --red: #d95b5b;
      --red-bg: #2a191b;

      --chat-bg: #e9e3da;
      --incoming: #ffffff;
      --outgoing: #d7f5d5;
      --translation: #fff2d5;

      --shadow: 0 2px 12px rgba(0,0,0,.16);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: grid;
      grid-template-columns:
        190px
        285px
        minmax(420px, 1fr)
        310px;

      height: 100dvh;
      min-height: 100vh;
      background: var(--bg);
    }

    /* ==================================================
       SIDEBAR
    ================================================== */

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(16px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .logo {
      font-size: 22px;
      line-height: 1;
      font-weight: 800;
      margin: 8px 4px 24px;
      white-space: nowrap;
    }

    .logo span {
      color: var(--green);
    }

    .new-message {
      background: var(--green);
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .new-message:active {
      transform: scale(.98);
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item {
      border: 0;
      background: transparent;
      text-align: left;

      padding: 12px;
      border-radius: 9px;

      color: #c7cdd3;
      font-size: 14px;

      transition: background .15s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--panel-hover);
      color: white;
    }

    .sidebar-spacer {
      flex: 1;
      min-height: 15px;
    }

    .auto-box {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px;

      font-size: 12px;
      line-height: 1.45;

      color: #c8cdd2;
      background: rgba(255,255,255,.01);
    }

    .auto-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;

      margin-bottom: 12px;
    }

    .green {
      color: var(--green-2);
    }

    .pause {
      margin-top: 14px;

      width: 100%;
      border: 1px solid #7a3636;

      color: #ff8d8d;
      background: var(--red-bg);

      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
    }

    .pause.paused {
      color: #b9f3c5;
      border-color: #2e8346;
      background: #15311f;
    }

    /* ==================================================
       CHAT LIST
    ================================================== */

    .chat-list {
      border-right: 1px solid var(--border);
      background: var(--panel-2);

      overflow-y: auto;
      min-width: 0;
    }

    .chat-header {
      position: sticky;
      top: 0;
      z-index: 3;

      padding:
        calc(17px + env(safe-area-inset-top))
        16px
        14px;

      background: rgba(16,22,28,.97);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid var(--border);
    }

    .chat-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;

      margin-bottom: 12px;
    }

    .chat-header h2 {
      font-size: 18px;
      white-space: nowrap;
    }

    .unread-count {
      color: var(--green-2);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap span {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: .7;
    }

    .search-input {
      width: 100%;
      border: 1px solid transparent;
      outline: none;

      background: #20272e;
      color: white;

      padding: 10px 10px 10px 35px;
      border-radius: 9px;

      font-size: 13px;
    }

    .search-input:focus {
      border-color: #3a4d5f;
    }

    .contacts {
      padding-bottom: 40px;
    }

    .contact {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #20272e;

      text-align: left;
      background: transparent;
      color: white;

      padding: 14px 16px;

      transition: background .12s ease;
    }

    .contact:hover {
      background: #182027;
    }

    .contact.active {
      background: #252d34;
    }

    .contact-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 5px;
    }

    .contact-name {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      font-size: 11px;
      color: #8e979f;
      flex-shrink: 0;
    }

    .preview {
      color: #9ba3aa;
      font-size: 12px;
      line-height: 1.35;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contact-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      min-height: 19px;
      padding: 2px 7px;

      border-radius: 999px;

      font-size: 10px;
      font-weight: 700;

      color: #cbd3da;
      background: #273039;
    }

    .badge.green-badge {
      color: #a6efb6;
      background: #183722;
    }

    /* ==================================================
       MAIN CHAT
    ================================================== */

    .main {
      min-width: 0;
      min-height: 0;

      display: flex;
      flex-direction: column;

      background: var(--chat-bg);
      color: #202020;
    }

    .topbar {
      min-height: 70px;
      padding:
        calc(12px + env(safe-area-inset-top))
        18px
        12px;

      background: var(--panel-2);
      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      border-bottom: 1px solid var(--border);
    }

    .topbar-person {
      min-width: 0;
    }

    .topbar-name {
      display: block;
      font-size: 16px;
      font-weight: 800;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .online {
      color: var(--green-2);
      font-size: 12px;
    }

    .offline {
      color: #a6adb3;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .actions button {
      border: 0;
      color: white;
      background: #252d34;

      padding: 9px 12px;
      border-radius: 8px;

      font-size: 12px;
      white-space: nowrap;
    }

    .actions .auto {
      background: var(--green-dark);
    }

    .actions .auto.off {
      color: #ddd;
      background: #4d3232;
    }

    .messages {
      flex: 1;
      min-height: 0;

      padding: 24px;
      overflow-y: auto;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,.12),
          transparent 34%
        ),
        var(--chat-bg);
    }

    .day-label {
      width: max-content;

      margin: 0 auto 18px;
      padding: 5px 10px;

      background: rgba(255,255,255,.72);
      color: #696969;

      border-radius: 8px;
      font-size: 11px;
    }

    .message-row {
      display: flex;
      margin-bottom: 9px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 72%;
      padding: 11px 13px;

      border-radius: 10px;
      line-height: 1.42;

      font-size: 14px;

      box-shadow: 0 1px 2px rgba(0,0,0,.13);
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .incoming {
      background: var(--incoming);
      border-top-left-radius: 4px;
    }

    .outgoing {
      background: var(--outgoing);
      border-top-right-radius: 4px;
    }

    .message-time {
      display: block;
      text-align: right;

      font-size: 10px;
      color: #838383;

      margin-top: 5px;
    }

    .translation-box {
      max-width: 72%;
      margin: -3px 0 13px;

      background: var(--translation);

      padding: 10px 13px;
      border-radius: 9px;

      font-size: 12px;
      line-height: 1.45;

      box-shadow: 0 1px 2px rgba(0,0,0,.09);
    }

    .translation-box.mine {
      margin-left: auto;
    }

    .translation-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #7c6842;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    /* ==================================================
       AI SUGGESTION CARD
    ================================================== */

    .ai-card {
      width: min(78%, 650px);

      margin: 24px auto;

      padding: 16px;

      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
    }

    .ai-card.hidden {
      display: none;
    }

    .ai-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;

      margin-bottom: 12px;
    }

    .ai-heading h4 {
      font-size: 14px;
    }

    .ai-chip {
      font-size: 10px;
      font-weight: 800;

      color: #256b39;
      background: #dff5e5;

      padding: 4px 7px;
      border-radius: 999px;
    }

    .ai-answer {
      background: var(--outgoing);

      padding: 13px 14px;
      border-radius: 8px;

      font-size: 14px;
      line-height: 1.45;

      margin-bottom: 10px;
    }

    .ai-translation {
      background: var(--translation);

      padding: 12px 14px;
      border-radius: 8px;

      font-size: 12px;
      line-height: 1.45;
    }

    .ai-buttons {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .ai-buttons button {
      flex: 1;

      border: 0;
      border-radius: 8px;

      padding: 10px 8px;

      font-weight: 750;
      font-size: 12px;
    }

    .send {
      background: var(--green);
      color: white;
    }

    .edit {
      background: #e6e7e8;
      color: #303030;
    }

    .reject {
      background: #ffdede;
      color: #9d3030;
    }

    .feedback-row {
      display: flex;
      gap: 7px;
      margin-top: 9px;
    }

    .feedback-row button {
      border: 1px solid #e3e3e3;
      background: #f6f6f6;
      color: #3c3c3c;

      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* ==================================================
       EDIT PANEL
    ================================================== */

    .edit-panel {
      display: none;
      margin-top: 12px;
    }

    .edit-panel.open {
      display: block;
    }

    .edit-panel textarea {
      width: 100%;
      min-height: 85px;

      border: 1px solid #c7c7c7;
      outline: none;

      resize: vertical;

      border-radius: 8px;
      padding: 10px;

      background: white;
      color: #222;

      line-height: 1.4;
    }

    .edit-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .edit-actions button {
      flex: 1;

      border: 0;
      border-radius: 8px;
      padding: 9px;

      font-size: 12px;
      font-weight: 700;
    }

    .save-edit {
      background: var(--green);
      color: white;
    }

    .cancel-edit {
      background: #ededed;
      color: #333;
    }

    /* ==================================================
       COMPOSER
    ================================================== */

    .composer {
      padding:
        12px
        15px
        calc(12px + env(safe-area-inset-bottom));

      background: var(--chat-bg);

      display: flex;
      gap: 9px;
      align-items: flex-end;

      border-top: 1px solid rgba(0,0,0,.05);
    }

    .composer textarea {
      flex: 1;

      min-height: 45px;
      max-height: 130px;

      border: 0;
      outline: none;
      resize: none;

      padding: 12px 13px;
      border-radius: 11px;

      background: white;
      color: #222;

      font-size: 14px;
      line-height: 1.4;
    }

    .composer button {
      flex: 0 0 46px;
      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 50%;

      background: var(--green);
      color: white;

      font-size: 19px;
    }

    /* ==================================================
       PROFILE
    ================================================== */

    .profile {
      min-width: 0;

      background: var(--panel-2);
      border-left: 1px solid var(--border);

      overflow-y: auto;

      padding-bottom: env(safe-area-inset-bottom);
    }

    .profile-section {
      padding: 19px;
      border-bottom: 1px solid var(--border);
    }

    .profile-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .profile h2 {
      font-size: 19px;
    }

    .close-profile {
      display: none;

      border: 0;
      background: #252d34;
      color: white;

      border-radius: 8px;
      padding: 7px 9px;
    }

    .avatar {
      width: 78px;
      height: 78px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #77818a,
          #252a30
        );

      margin: 12px auto 13px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 28px;
      font-weight: 800;
    }

    .profile-status {
      text-align: center;
      margin-bottom: 15px;

      font-size: 12px;
      color: #c9d0d5;
    }

    .status-dot {
      color: var(--green-2);
    }

    .profile-data {
      font-size: 13px;
      line-height: 1.8;
      color: #c9cfd4;
    }

    .profile-section h3 {
      font-size: 14px;
      margin-bottom: 9px;
    }

    .profile-section p,
    .profile-section li {
      font-size: 13px;
      color: #c1c8ce;
      line-height: 1.55;
    }

    .profile-section ul {
      list-style: none;
    }

    .profile-section li {
      margin: 4px 0;
    }

    .profile-note {
      background: #181f26;
      border: 1px solid #2d3740;
      padding: 10px;
      border-radius: 9px;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ==================================================
       TOAST
    ================================================== */

    .toast {
      position: fixed;

      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));

      transform: translate(-50%, 20px);

      max-width: min(90vw, 450px);

      background: #111820;
      color: white;

      border: 1px solid #303b45;
      border-radius: 10px;

      padding: 11px 15px;

      box-shadow: 0 8px 30px rgba(0,0,0,.3);

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition:
        opacity .2s ease,
        transform .2s ease;

      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ==================================================
       TABLET
    ================================================== */

    @media (max-width: 1180px) {

      .app {
        grid-template-columns:
          155px
          235px
          minmax(390px, 1fr);
      }

      .profile {
        display: none;

        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;

        z-index: 30;

        width: min(360px, 88vw);

        box-shadow: -15px 0 40px rgba(0,0,0,.4);
      }

      .profile.open {
        display: block;
      }

      .close-profile {
        display: inline-block;
      }

      .sidebar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .nav-item {
        padding-left: 10px;
        padding-right: 10px;
      }

      .ai-card {
        width: 88%;
      }

    }

    /* ==================================================
       SMALL TABLET / PHONE
    ================================================== */

    @media (max-width: 820px) {

      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto minmax(65vh, 1fr);

        height: auto;
        min-height: 100dvh;
      }

      .sidebar {
        position: relative;

        border-right: 0;
        border-bottom: 1px solid var(--border);

        padding:
          calc(10px + env(safe-area-inset-top))
          10px
          10px;
      }

      .logo {
        margin: 5px 4px 12px;
      }

      .new-message {
        display: none;
      }

      .nav {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        gap: 5px;

        padding-bottom: 2px;
      }

      .nav-item {
        flex: 0 0 auto;
        white-space: nowrap;
        padding: 9px 11px;
      }

      .sidebar-spacer,
      .auto-box {
        display: none;
      }

      .chat-list {
        border-right: 0;
        border-bottom: 1px solid var(--border);

        max-height: 260px;
      }

      .chat-header {
        padding:
          13px
          12px
          10px;
      }

      .contact {
        padding: 11px 13px;
      }

      .main {
        min-height: 68dvh;
      }

      .topbar {
        padding:
          10px
          12px;
      }

      .actions button {
        padding: 8px 9px;
      }

      .messages {
        padding: 15px 12px;
      }

      .bubble,
      .translation-box {
        max-width: 88%;
      }

      .ai-card {
        width: 96%;
      }

      .ai-buttons {
        flex-wrap: wrap;
      }

      .ai-buttons button {
        min-width: 30%;
      }

    }

    @media (max-width: 520px) {

      .actions .notes-btn {
        display: none;
      }

      .bubble,
      .translation-box {
        max-width: 94%;
      }

      .ai-heading {
        align-items: flex-start;
      }

      .ai-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .ai-buttons .send {
        grid-column: span 2;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <!-- ==================================================
       SIDEBAR
  ================================================== -->

  <aside class="sidebar">

    <div class="logo">
      👑 Marcel <span>AI</span>
    </div>

    <button
      class="new-message"
      id="newMessageButton"
      type="button"
    >
      ＋ Neue Nachricht
    </button>

    <nav class="nav">

      <button
        class="nav-item active"
        type="button"
        data-nav="overview"
      >
        ⌂ Übersicht
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="chats"
      >
        💬 Chats
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="dates"
      >
        📅 Dates
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="contacts"
      >
        👤 Kontakte
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="media"
      >
        🖼 Medien
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="analysis"
      >
        📊 Analyse
      </button>

      <button
        class="nav-item"
        type="button"
        data-nav="settings"
      >
        ⚙ Einstellungen
      </button>

    </nav>

    <div class="sidebar-spacer"></div>

    <div class="auto-box">

      <div class="auto-title">
        <b>Auto-Modus</b>
        <span
          id="globalAutoStatus"
          class="green"
        >
          Aktiv
        </span>
      </div>

      Antwortverzögerung<br>
      <b>2–20 Min</b>

      <br><br>

      Ruhezeiten<br>
      <b>23:00–08:00</b>

      <button
        class="pause"
        id="pauseAllButton"
        type="button"
      >
        Pause für alle
      </button>

    </div>

  </aside>


  <!-- ==================================================
       CONTACT LIST
  ================================================== -->

  <section class="chat-list">

    <div class="chat-header">

      <div class="chat-title-row">

        <h2>
          Alle Chats
        </h2>

        <span
          id="unreadCount"
          class="unread-count"
        >
          0 ungelesen
        </span>

      </div>

      <div class="search-wrap">

        <span>🔍</span>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Suchen"
          autocomplete="off"
        >

      </div>

    </div>

    <div
      id="contactsContainer"
      class="contacts"
    ></div>

  </section>


  <!-- ==================================================
       MAIN CHAT
  ================================================== -->

  <main class="main">

    <div class="topbar">

  /* ==================================================
     HELPERS
  ================================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );

  }


  function selectedContact() {

    return contacts.find(
      contact =>
        contact.id === selectedContactId
    ) || null;

  }


  function showToast(
    text
  ) {

    toast.textContent =
      text;


    toast.classList.add(
      "show"
    );


    window.clearTimeout(
      showToast.timer
    );


    showToast.timer =
      window.setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        2200
      );

  }


  function initials(
    name
  ) {

    return String(
      name || "?"
    )
      .trim()
      .split(
        /\s+/
      )
      .slice(
        0,
        2
      )
      .map(
        part =>
          part.charAt(0)
      )
      .join("")
      .toUpperCase()
      ||
      "?";

  }


  function resizeComposer() {

    composerInput.style.height =
      "auto";


    composerInput.style.height =
      Math.min(
        composerInput.scrollHeight,
        130
      )

      "px";

  }


  /* ==================================================
     CONTACT LIST
  ================================================== */

  function renderContacts() {

    const query =
      String(
        searchInput.value || ""
      )
        .trim()
        .toLowerCase();


    const filtered =
      contacts.filter(
        contact => {

          const haystack =
            [
              contact.name,
              contact.city,
              contact.country,
              contact.language
            ]
              .filter(
                Boolean
              )
              .join(
                " "
              )
              .toLowerCase();


          return haystack.includes(
            query
          );

        }
      );


    if (
      filtered.length === 0
    ) {

      contactsContainer.innerHTML =
        '<div class="empty">Kein Kontakt gefunden.</div>';


    } else {

      contactsContainer.innerHTML =
        filtered
          .map(
            contact => {

              const lastMessage =
                contact.messages[
                  contact.messages.length - 1
                ];


              return `
                <button
                  class="contact ${
                    contact.id === selectedContactId
                      ? "active"
                      : ""
                  }"
                  type="button"
                  data-contact-id="${escapeHtml(contact.id)}"
                >

                  <div class="contact-top">

                    <span class="contact-name">
                      ${escapeHtml(contact.name)}
                    </span>

                    <span class="time">
                      ${escapeHtml(lastMessage?.time || "")}
                    </span>

                  </div>

                  <div class="preview">
                    ${escapeHtml(lastMessage?.text || "Noch keine Nachricht")}
                  </div>

                  <div class="contact-meta">

                    ${
                      contact.unread > 0
                        ? `
                          <span class="badge green-badge">
                            ${contact.unread} neu
                          </span>
                        `
                        : ""
                    }

                    <span class="badge">
                      ${
                        contact.autoReply
                          ? "Auto"
                          : "Manuell"
                      }
                    </span>

                  </div>

                </button>
              `;

            }
          )
          .join("");

    }


    const unread =
      contacts.reduce(
        (
          total,
          contact
        ) =>
          total
          +
          Number(
            contact.unread || 0
          ),
        0
      );


    unreadCount.textContent =
      `${unread} ungelesen`;


    contactsContainer
      .querySelectorAll(
        "[data-contact-id]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              selectedContactId =
                button.dataset.contactId;


              const contact =
                selectedContact();


              if (
                contact
              ) {

                contact.unread =
                  0;

              }


              renderAll();

            }
          );

        }
      );

  }

  function messageHtml(
    message
  ) {

    const mine =
      message.direction === "outgoing";


    return `
      <div class="message-row ${mine ? "mine" : ""}">

        <div class="bubble ${mine ? "outgoing" : "incoming"}">

          ${escapeHtml(message.text)}

          <span class="message-time">
            ${escapeHtml(message.time || "")}
          </span>

        </div>

      </div>

      ${
        message.translation
          ? `
            <div class="translation-box ${mine ? "mine" : ""}">

              <span class="translation-label">
                Deutsche Übersetzung
              </span>

              ${escapeHtml(message.translation)}

            </div>
          `
          : ""
      }
    `;

  }

    }

  function bindAiCard(
    contact
  ) {

    const aiCard =
      document.getElementById(
        "aiCard"
      );


    if (
      !aiCard
    ) {

      return;

    }


    const aiSendButton =
      document.getElementById(
        "aiSendButton"

    const aiEditButton =
      document.getElementById(
        "aiEditButton"

    const aiRejectButton =
      document.getElementById(
        "aiRejectButton"
      );


    const positiveFeedbackButton =
      document.getElementById(
        "positiveFeedbackButton"

    const negativeFeedbackButton =
      document.getElementById(
        "negativeFeedbackButton"
      );


    const editPanel =
      document.getElementById(
        "editPanel"
      );


    const editSuggestionInput =
      document.getElementById(
        "editSuggestionInput"
      );


    const saveEditButton =
      document.getElementById(
        "saveEditButton"
      );


    const cancelEditButton =
      document.getElementById(
        "cancelEditButton"
      );


    aiSendButton.addEventListener(
      "click",
      () => {

        if (
          globalPaused
        ) {

          showToast(
            "Globaler Auto-Modus ist pausiert."
          );


          return;

        }


        contact.messages.push({

          direction:
            "outgoing",

          text:
            contact.suggestion.text,

          translation:
            contact.suggestion.translation,

          time:
            new Date()
              .toLocaleTimeString(
                "de-DE",
                {
                  hour:
                    "2-digit",

                  minute:
                    "2-digit"
                }
              )

        });


        contact.suggestion =
          null;


        renderAll();


        showToast(
          "Demo: Antwort wurde in den Chat übernommen."
        );

      }
    );


    aiEditButton.addEventListener(
      "click",
      () => {

        editSuggestionInput.value =
          contact.suggestion.text;


        editPanel.classList.add(
          "open"
        );


        editSuggestionInput.focus();

      }
    );


    aiRejectButton.addEventListener(
      "click",
      () => {

        contact.suggestion =
          null;


        renderChat(
          contact
        );


        showToast(
          "Vorschlag verworfen."
        );

      }
    );


    positiveFeedbackButton
      .addEventListener(
        "click",
        () => {

          showToast(
            "👍 Feedback vorgemerkt. Speicherung kommt mit Railway-Anbindung."
          );

        }
      );


    negativeFeedbackButton
      .addEventListener(
        "click",
        () => {

          editSuggestionInput.value =
            contact.suggestion.text;


          editPanel.classList.add(
            "open"
          );


          editSuggestionInput.focus();


          showToast(
            "👎 Du kannst direkt deine bessere Version eintragen."
          );

        }
      );


    saveEditButton.addEventListener(
      "click",
      () => {

        const corrected =
          String(
            editSuggestionInput.value || ""
          )
            .trim();


        if (
          !corrected
        ) {

          showToast(
            "Bitte zuerst deine Korrektur eingeben."
          );


          return;

        }


        contact.suggestion.text =
          corrected;


        document.getElementById(
          "aiAnswerText"
        ).textContent =
          corrected;


        editPanel.classList.remove(
          "open"
        );


        showToast(
          "Korrektur übernommen. Persistenz folgt mit Backend-Anbindung."
        );

      }
    );


    cancelEditButton
      .addEventListener(
        "click",
        () => {

          editPanel.classList.remove(
            "open"
          );

        }
      );

  }


  function renderChat(
    contact
  ) {

    if (
      !contact
    ) {

      messagesContainer.innerHTML =
        '<div class="empty">Bitte einen Kontakt auswählen.</div>';


      return;

    }


    topbarName.textContent =
      contact.name;


    topbarStatus.textContent =
      contact.online
        ? "● Online"
        : "● Offline";


    topbarStatus.className =
      contact.online
        ? "online"
        : "offline";


    messagesContainer.innerHTML = `
      <div class="day-label">
        Heute
      </div>

      ${contact.messages
        .map(
          messageHtml
        )
        .join("")}

      ${aiCardHtml(contact)}
    `;


    bindAiCard(
      contact
    );


    contactAutoButton.textContent =
      contact.autoReply
        ? "Auto ✓"
        : "Auto aus";


    contactAutoButton.classList.toggle(
      "off",
      !contact.autoReply
    );


    requestAnimationFrame(
      () => {

        messagesContainer.scrollTop =
          messagesContainer.scrollHeight;

      }
    );

  }

      <br>

      Sprache:
      <b>${escapeHtml(contact.language || "—")}</b>
    `;


    profileAbout.textContent =
      contact.about || "—";


    profileInterests.innerHTML =
      (
        contact.interests || []
      )
        .map(
          interest =>
            `<li>${escapeHtml(interest)}</li>`
        )
        .join("")
      ||
      "<li>Keine gespeichert.</li>";


    profileDate.textContent =
      contact.nextDate
      ||
      "Kein Date gespeichert.";


    profileNotes.textContent =
      contact.notes || "—";


    profileMemoryStatus.innerHTML = `

      ACTIVE:
      <b>${contact.memoryStatus?.active ?? 0}</b>
      <br>

      HISTORIE:
      <b>${contact.memoryStatus?.historical ?? 0}</b>
      <br>

      EVENTS:
      <b>${contact.memoryStatus?.events ?? 0}</b>

    `;

  }


  /* ==================================================
     GLOBAL RENDER
  ================================================== */

  function renderAll() {

    const contact =
      selectedContact();


    renderContacts();

    renderChat(
      contact
    );

    renderProfile(
      contact
    );

  }


  /* ==================================================
     EVENTS
  ================================================== */

  searchInput.addEventListener(
    "input",
    () => {

      renderContacts();

    }
  );


  profileButton.addEventListener(
    "click",
    () => {

      profilePanel.classList.add(
        "open"
      );

    }
  );


  closeProfileButton.addEventListener(
    "click",
    () => {

      profilePanel.classList.remove(
        "open"
      );

    }
  );


  notesButton.addEventListener(
    "click",
    () => {

      profilePanel.classList.add(
        "open"
      );


      showToast(
        "Notizen stehen rechts im Kontaktprofil."
      );

    }
  );


  contactAutoButton.addEventListener(
    "click",
    () => {

      const contact =
        selectedContact();


      if (
        !contact
      ) {

        return;

      }


      contact.autoReply =
        !contact.autoReply;


      renderAll();


      showToast(
        contact.autoReply
          ? `Auto-Modus für ${contact.name} aktiviert.`
          : `Auto-Modus für ${contact.name} deaktiviert.`
      );

    }
  );


  pauseAllButton.addEventListener(
    "click",
    () => {

      globalPaused =
        !globalPaused;


      pauseAllButton.classList.toggle(
        "paused",
        globalPaused
      );


      pauseAllButton.textContent =
        globalPaused
          ? "Auto-Modus fortsetzen"
          : "Pause für alle";


      globalAutoStatus.textContent =
        globalPaused
          ? "Pausiert"
          : "Aktiv";


      globalAutoStatus.classList.toggle(
        "green",
        !globalPaused
      );


      showToast(
        globalPaused
          ? "Globaler Auto-Modus pausiert."
          : "Globaler Auto-Modus wieder aktiv."
      );

    }
  );


  composerInput.addEventListener(
    "input",
    resizeComposer
  );


  composerInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
        &&
        !event.shiftKey
      ) {

        event.preventDefault();


        sendManualMessage();

      }

    }
  );


  composerSendButton.addEventListener(
    "click",
    sendManualMessage
  );


  function sendManualMessage() {

    const contact =
      selectedContact();


    const text =
      String(
        composerInput.value || ""
      )
        .trim();


    if (
      !contact
    ) {

      showToast(
        "Bitte zuerst einen Kontakt auswählen."
      );


      return;

    }


    if (
      !text
    ) {

      return;

    }


    contact.messages.push({

      direction:
        "outgoing",

      text,

      translation:
        null,

      time:
        new Date()
          .toLocaleTimeString(
            "de-DE",
            {
              hour:
                "2-digit",

              minute:
                "2-digit"
            }
          )

    });


    composerInput.value =
      "";


    resizeComposer();


    renderAll();


    showToast(
      "Demo: Manuelle Nachricht wurde in den Chat übernommen."
    );

  }


  document
    .querySelectorAll(
      "[data-nav]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                "[data-nav]"
              )
              .forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


            button.classList.add(
              "active"
            );


            const section =
              button.dataset.nav;


            if (
              section !== "overview"
              &&
              section !== "chats"
            ) {

              showToast(
                "Dieser Bereich wird als nächster Dashboard-Block angeschlossen."
              );

            }

          }
        );

      }
    );


  document
    .getElementById(
      "newMessageButton"
    )
    .addEventListener(
      "click",
      () => {

        composerInput.focus();


        showToast(
          "Kontakt auswählen und Nachricht unten schreiben."
        );

      }
    );


  /* ==================================================
     START
  ================================================== */

  renderAll();

})();
</script>

</body>
</html>
