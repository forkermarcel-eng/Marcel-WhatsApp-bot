<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marcel AI | Kontakte</title><link rel="stylesheet" href="/platform.css"><style>
.headtools{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;border:1px solid #303941;background:#111820;color:#fff;border-radius:9px;padding:10px}.filters{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.filter{border:1px solid #283139;background:#111820;color:#939da4;border-radius:99px;padding:8px 12px;white-space:nowrap}.filter.active{background:#183020;color:#d5f4dd}.workspace{display:grid;grid-template-columns:minmax(420px,1.1fr) minmax(440px,1fr);gap:14px}.table{padding:0;overflow:hidden}.row{display:grid;grid-template-columns:40px minmax(130px,1fr) 100px minmax(130px,1fr);gap:10px;align-items:center;padding:12px;border-top:1px solid #252e35;cursor:pointer}.row:hover,.row.active{background:#151e24}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#1c2730}.name{font-weight:800}.small{font-size:11px;color:#8d979e;overflow:hidden;text-overflow:ellipsis}.channels{display:flex;gap:4px}.channel{padding:5px 7px;border-radius:99px;background:#17301f;color:#6de187;font-size:10px}.detail{position:sticky;top:24px;max-height:calc(100dvh - 48px);overflow:auto}.detail-head{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding-bottom:14px}.detail-head .avatar{width:52px;height:52px}.detail h2{margin:0}.tabs{display:flex;overflow:auto;border-bottom:1px solid #293139}.tabs button{background:none;border:0;color:#929ca3;padding:10px}.tabs button.active{color:#fff;border-bottom:2px solid #41c965}.body{padding-top:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact,.memory{padding:10px;border:1px solid #29323a;border-radius:9px;background:#10171d;font-size:12px}.fact span,.meta{display:block;color:#89939a;font-size:10px;margin-bottom:4px}.values{margin-top:6px}.value{display:grid;grid-template-columns:minmax(90px,.45fr) 1fr;gap:8px;padding:5px 0;border-top:1px solid #252e35}.value span{color:#89939a}.authority{color:#6edb87;margin-top:7px}.timeline{border-left:2px solid #29343c;margin-left:5px;padding-left:12px;display:grid;gap:9px}.event{position:relative;border:1px solid #29323a;border-radius:9px;padding:10px;background:#10171d}.event:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#41c965;left:-17px;top:15px}.event-head{display:flex;justify-content:space-between;gap:8px;font-size:11px}.event-type{color:#9da7ae;margin:5px 0}.loading,.empty{padding:25px;text-align:center}.count{color:#8f999f;font-size:13px}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.detail{position:static;max-height:none}}@media(max-width:650px){.cards{grid-template-columns:1fr}.row{grid-template-columns:40px minmax(120px,1fr) 80px}.row>*:last-child{display:none}.detail-head{grid-template-columns:46px 1fr auto}.headtools{flex-direction:column}}@media(min-width:760px) and (max-width:1180px){.platform-wrap{max-width:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="platform-layout"><aside class="platform-rail"><div class="platform-brand">MARCEL <span>AI</span></div><button class="platform-toggle">Menü</button><nav class="platform-nav"><a href="/Hub/">Hub</a><a href="/Dashboard/">WhatsApp</a><a href="/Tinder/">Tinder</a><a href="/Instagram/">Instagram</a><a href="/X/">X (Twitter)</a><a href="/Brain/">Brain</a><a href="/Trading/">Trading</a><div class="platform-secondary"><a class="active" href="/Kontakte/">Kontakte</a><a href="/Analyse/">Analyse</a><a href="/Einstellungen/">Einstellungen</a></div></nav></aside><main class="platform-main"><div class="platform-wrap"><header class="page-head"><div><h1>Kontakte</h1><div class="count" id="count">Kontakte werden geladen …</div></div><a class="button" href="/Dashboard/?view=add-contact">＋ Kontakt hinzufügen</a></header><div class="headtools"><input class="search" id="search" type="search" placeholder="Kontakte durchsuchen"></div><div class="filters" id="filters"><button class="filter active" data-filter="all">Alle</button><button class="filter" data-filter="whatsapp">WhatsApp</button><button class="filter" data-filter="tinder">Tinder</button><button class="filter" data-filter="instagram">Instagram</button><button class="filter" data-filter="x">X (Twitter)</button></div><section class="workspace"><div class="card table" id="list"><div class="loading">Kontakte werden geladen …</div></div><aside class="card detail" id="detail"><div class="empty">Kontakt auswählen.</div></aside></section></div></main></div><script src="/presentation.js"></script><script>
const $=id=>document.getElementById(id),P=MarcelPresentation,esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let contacts=[],selected=null,filter="all",detail=null;const name=c=>c.name||c.displayName||c.whatsappDisplayName||"Unbekannter Kontakt";const channels=c=>{const set=new Set(),platforms=[c.sourcePlatform,c.currentPlatform].filter(Boolean).map(v=>String(v).toLowerCase());if(c.jid||c.whatsappJid||c.phoneNumber||c.whatsappUsername)set.add("whatsapp");for(const p of platforms){if(p.includes("tinder"))set.add("tinder");if(p.includes("instagram"))set.add("instagram");if(p==="x"||p.includes("twitter"))set.add("x")}return [...set]};const last=c=>c.lastMessage?.text||c.lastMessageText||"Keine Nachricht";
async function api(url){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});if(r.status===401){location.href="/login.html";throw Error("Sitzung abgelaufen.")}const d=await r.json();if(!r.ok)throw Error(d.error||"Kontakte konnten nicht geladen werden.");return d}
function shown(){const q=$("search").value.trim().toLowerCase();return contacts.filter(c=>(filter==="all"||channels(c).includes(filter))&&[name(c),c.city,c.country,c.phoneNumber,c.whatsappUsername,last(c)].filter(Boolean).join(" ").toLowerCase().includes(q))}
function renderList(){const rows=shown(),short={whatsapp:"WA",tinder:"T",instagram:"IG",x:"X"};$("count").textContent=`${contacts.length} Kontakte · ${rows.length} angezeigt`;$("list").innerHTML=rows.length?rows.map(c=>`<div class="row ${String(c.id)===String(selected)?"active":""}" data-id="${esc(c.id)}"><div class="avatar">👤</div><div><div class="name">${esc(name(c))}</div><div class="small">${esc([c.city,c.country].filter(Boolean).join(", ")||"Keine Ortsangabe")}</div></div><div class="channels">${channels(c).map(x=>`<span class="channel" title="${esc(P.channel(x))}">${short[x]}</span>`).join("")}</div><div class="small">${esc(last(c))}</div></div>`).join(""):'<div class="empty">Keine Kontakte für diesen Filter.</div>';$("list").querySelectorAll("[data-id]").forEach(row=>row.onclick=()=>select(row.dataset.id))}
const valueRows=v=>P.displayRows(v).map(r=>`<div class="value"><span>${esc(r.label)}</span><b>${esc(r.value)}</b></div>`).join("");
function overview(c){const vals=[["Land",c.country],["Stadt",c.city],["Sprache",c.language],["Alter",c.age],["Geburtstag",c.birthdayLabel],["Telefon",c.phoneNumber],["WhatsApp",c.whatsappUsername],["Kanäle",channels(c).map(P.channel).join(", ")||"Keine verbundenen Kanäle"]].filter(([,v])=>v!==undefined&&v!==null&&v!=="");return `<div class="cards">${vals.map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>`}
function brain(){const active=detail?.activeItems||[],historical=detail?.historicalItems||[];const card=(x,state)=>`<article class="memory"><b>${esc(P.label(x.key||x.category))}</b><div class="meta">${esc(P.label(x.category))} · ${esc(P.memoryType(x.memoryType))} · ${state}</div><div class="values">${valueRows(x.value)}</div>${["confirmed","corrected"].includes(x.reviewStatus)?`<div class="authority">✓ ${esc(P.status(x.reviewStatus))}</div>`:""}</article>`;return active.length||historical.length?`<div class="cards">${active.map(x=>card(x,x.memoryType==="temporary_state"?"Temporär":"Aktiv")).join("")}${historical.map(x=>card(x,"Historisch")).join("")}</div>`:'<div class="empty">Keine Woman-Brain-Fakten vorhanden.</div>'}
function media(text){const s=String(text||"");if(/bild.+weggelassen|image omitted/i.test(s))return "Bild";if(/sticker.+weggelassen|sticker omitted/i.test(s))return "Sticker";if(/audio.+weggelassen|sprachnachricht|voice message/i.test(s))return "Sprachnachricht";return null}
function activity(){const messages=detail?.messages||[],events=detail?.events||[],items=[...messages.map(m=>({at:m.createdAt||m.created_at||m.timestamp,actor:m.direction==="outgoing"?"Marcel":"Kontakt",channel:"WhatsApp",type:media(m.text)||"Nachricht",text:media(m.text)?null:(m.translationDe||m.translation_de||m.text)})),...events.map(e=>({at:e.startedAt||e.createdAt,actor:"System",channel:P.channel(detail?.contact?.currentPlatform||"whatsapp"),type:P.label(e.type||e.subtype||"Ereignis"),text:e.title||e.evidenceSummary}))].sort((a,b)=>new Date(b.at||0)-new Date(a.at||0)).slice(0,40);return items.length?`<div class="timeline">${items.map(x=>`<article class="event"><div class="event-head"><b>${esc(x.actor)} · ${esc(x.channel)}</b><time>${esc(P.dateTime(x.at))}</time></div><div class="event-type">${esc(x.type)}</div>${x.text?`<div>„${esc(x.text)}“</div>`:""}</article>`).join("")}</div>`:'<div class="empty">Keine Aktivität vorhanden.</div>'}
function renderDetail(tab="overview"){const c=detail?.contact||contacts.find(x=>String(x.id)===String(selected));if(!c){$("detail").innerHTML='<div class="empty">Kontakt auswählen.</div>';return}const tabs={overview:"Übersicht",brain:"Woman Brain",activity:"Aktivität",files:"Dateien"},body=tab==="overview"?overview(c):tab==="brain"?brain():tab==="activity"?activity():'<div class="empty">Keine Dateiliste über die aktuelle Kontakt-API verfügbar.</div>';$("detail").innerHTML=`<div class="detail-head"><div class="avatar">👤</div><div><h2>${esc(name(c))}</h2><div class="small">${esc([c.city,c.country].filter(Boolean).join(", ")||"Kontakt")}</div></div><a class="button" href="/Dashboard/?view=edit-contact&contact=${encodeURIComponent(c.id)}">Bearbeiten</a></div><div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?"active":""}" data-tab="${k}">${v}</button>`).join("")}</div><div class="body">${body}</div>`;$("detail").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>renderDetail(b.dataset.tab))}
async function select(id){selected=id;renderList();$("detail").innerHTML='<div class="loading">Details werden geladen …</div>';try{detail=await api(`/api/dashboard/contacts?id=${encodeURIComponent(id)}`);renderDetail()}catch(e){$("detail").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$("search").oninput=renderList;$("filters").onclick=e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderList()};document.querySelector(".platform-toggle").onclick=()=>document.querySelector(".platform-rail").classList.toggle("open");api("/api/dashboard/contacts").then(d=>{contacts=d.contacts||[];renderList();if(contacts[0])select(contacts[0].id)}).catch(e=>$("list").innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script></body></html>
