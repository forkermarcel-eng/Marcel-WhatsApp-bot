<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marcel AI | Kontakte</title><link rel="stylesheet" href="/platform.css"><style>.contacts-head{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:220px;border:1px solid #303941;background:#111820;color:#fff;border-radius:9px;padding:10px 12px}.filters{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.filter{border:1px solid #283139;background:#111820;color:#939da4;border-radius:999px;padding:8px 12px;white-space:nowrap}.filter.active{background:#183020;color:#d5f4dd;border-color:#315d3d}.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,.8fr);gap:14px}.table{overflow:hidden;padding:0}.row{display:grid;grid-template-columns:44px minmax(150px,1fr) 110px minmax(150px,1.2fr) 105px 70px;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid #252e35;cursor:pointer}.row:first-child{border-top:0}.row:hover,.row.active{background:#151e24}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#1c2730}.contact-name{font-weight:800;font-size:13px}.small{color:#8d979e;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channels{display:flex;gap:5px}.channel{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#17301f;color:#6de187;font-size:11px}.status{color:#6edb87;font-size:11px}.detail{position:sticky;top:30px;align-self:start}.detail-head{text-align:center;padding-bottom:16px}.detail-head .avatar{width:58px;height:58px;margin:auto;font-size:22px}.detail h2{margin:9px 0 4px}.detail-tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid #293139}.detail-tabs button{background:transparent;border:0;color:#929ca3;padding:9px 8px;white-space:nowrap}.detail-tabs button.active{color:#fff;border-bottom:2px solid #41c965}.detail-body{padding-top:13px}.fact{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:7px 0;font-size:12px}.fact span:first-child{color:#89939a}.edit{display:block;text-align:center;margin-top:15px}.loading{padding:30px;text-align:center}.count{color:#8f999f;font-size:13px}@media(max-width:1100px){.row{grid-template-columns:44px minmax(140px,1fr) 90px minmax(130px,1fr) 90px}.row>*:last-child{display:none}}@media(max-width:900px){.workspace{grid-template-columns:1fr}.detail{position:static}.row{grid-template-columns:44px minmax(130px,1fr) 90px minmax(120px,1fr)}.row>*:nth-child(5){display:none}}@media(max-width:560px){.row{grid-template-columns:40px minmax(100px,1fr) 70px}.row>*:nth-child(4){display:none}.contacts-head{flex-direction:column}.search{min-width:0;width:100%}}</style></head><body><div class="platform-layout"><aside class="platform-rail"><div class="platform-brand">MARCEL <span>AI</span></div><button class="platform-toggle">Menü</button><nav class="platform-nav"><a href="/Hub/">Hub</a><a href="/Dashboard/">WhatsApp</a><a href="/Tinder/">Tinder</a><a href="/Instagram/">Instagram</a><a href="/X/">X (Twitter)</a><a href="/Brain/">Brain</a><a href="/Trading/">Trading</a><div class="platform-secondary"><a class="active" href="/Kontakte/">Kontakte</a><a href="/Analyse/">Analyse</a><a href="/Einstellungen/">Einstellungen</a></div></nav></aside><main class="platform-main"><div class="platform-wrap"><header class="page-head"><div><h1>Kontakte</h1><div class="count" id="count">Kontakte werden geladen …</div></div><a class="button" href="/Dashboard/?view=add-contact">＋ Kontakt hinzufügen</a></header><div class="contacts-head"><input class="search" id="search" type="search" placeholder="Kontakte durchsuchen"></div><div class="filters" id="filters"><button class="filter active" data-filter="all">Alle</button><button class="filter" data-filter="whatsapp">WhatsApp</button><button class="filter" data-filter="tinder">Tinder</button><button class="filter" data-filter="instagram">Instagram</button><button class="filter" data-filter="x">X (Twitter)</button></div><section class="workspace"><div class="card table" id="list"><div class="loading empty">Kontakte werden geladen …</div></div><aside class="card detail" id="detail"><div class="empty">Kontakt auswählen.</div></aside></section></div></main></div><script>
const $=id=>document.getElementById(id),esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));let contacts=[],selected=null,filter="all",detailData=null;const name=c=>c.name||c.displayName||c.whatsappDisplayName||"Unbekannter Kontakt";const channelsOf=c=>{const channels=new Set(),platforms=[c.sourcePlatform,c.currentPlatform].filter(Boolean).map(value=>String(value).toLowerCase());if(c.jid||c.whatsappJid||c.whatsapp_jid||c.phoneNumber||c.whatsappUsername)channels.add("whatsapp");for(const platform of platforms){if(platform.includes("tinder"))channels.add("tinder");if(platform.includes("instagram"))channels.add("instagram");if(platform==="x"||platform.includes("twitter"))channels.add("x")}return [...channels]};const hasWhatsapp=c=>channelsOf(c).includes("whatsapp");const lastText=c=>c.lastMessage?.text||c.lastMessageText||"Keine Nachricht";const lastAt=c=>c.lastMessage?.createdAt||c.lastMessageAt||c.updatedAt||c.createdAt;
async function api(url){const response=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});if(response.status===401){location.href="/login.html";throw Error("Sitzung abgelaufen.")}const data=await response.json();if(!response.ok)throw Error(data.error||"Kontakte konnten nicht geladen werden.");return data}
function visible(){const q=$("search").value.trim().toLowerCase();return contacts.filter(c=>(filter==="all"||channelsOf(c).includes(filter))&&[name(c),c.city,c.country,c.phoneNumber,c.whatsappUsername,lastText(c)].filter(Boolean).join(" ").toLowerCase().includes(q))}
function renderList(){const rows=visible(),channelLabels={whatsapp:"WA",tinder:"T",instagram:"IG",x:"X"};$("count").textContent=`${contacts.length} Kontakte · ${rows.length} angezeigt`;$("list").innerHTML=rows.length?rows.map(c=>{const channels=channelsOf(c);return `<div class="row ${String(c.id)===String(selected)?"active":""}" data-id="${esc(c.id)}"><div class="avatar">👤</div><div><div class="contact-name">${esc(name(c))}</div><div class="small">${esc([c.city,c.country].filter(Boolean).join(", ")||"Keine Ortsangabe")}</div></div><div class="channels">${channels.map(channel=>`<span class="channel" title="${esc(channel)}">${channelLabels[channel]}</span>`).join("")}</div><div class="small">${esc(lastText(c))}</div><div class="small">${lastAt(c)?new Date(lastAt(c)).toLocaleDateString("de-DE"):"—"}</div><div class="status">${channels.length?"Aktiv":"Gespeichert"}</div></div>`}).join(""):'<div class="loading empty">Keine Kontakte für diesen Filter.</div>';$("list").querySelectorAll("[data-id]").forEach(row=>row.onclick=()=>select(row.dataset.id))}
function facts(c){return [["Land",c.country],["Stadt",c.city],["Sprache",c.language],["Alter",c.age],["Geburtstag",c.birthdayLabel],["Telefon",c.phoneNumber],["WhatsApp",c.whatsappUsername],["Notizen",c.notes||c.note]].filter(([,v])=>v!==undefined&&v!==null&&v!=="")}
function renderDetail(tab="overview"){const c=detailData?.contact||contacts.find(x=>String(x.id)===String(selected));if(!c){$("detail").innerHTML='<div class="empty">Kontakt auswählen.</div>';return}const tabs=["overview","brain","activity","files"],labels={overview:"Übersicht",brain:"Woman Brain",activity:"Aktivität",files:"Dateien"};let body="";if(tab==="overview"){const channels=channelsOf(c);body=facts(c).map(([k,v])=>`<div class="fact"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")+`<div class="fact"><span>Kanäle</span><b>${esc(channels.length?channels.map(value=>({whatsapp:"WhatsApp",tinder:"Tinder",instagram:"Instagram",x:"X (Twitter)"}[value])).join(", "):"Keine verbundenen Kanäle")}</b></div>`}if(tab==="brain"){const items=detailData?.activeItems||[];body=items.length?items.slice(0,20).map(x=>`<div class="fact"><span>${esc(x.key||x.memory_key||x.category)}</span><b>${esc(typeof (x.value||x.memory_value)==="object"?JSON.stringify(x.value||x.memory_value):x.value||x.memory_value)}</b></div>`).join(""):'<div class="empty">Keine aktiven Woman-Brain-Fakten.</div>'}if(tab==="activity"){const messages=detailData?.messages||[];body=messages.length?messages.slice(-12).reverse().map(m=>`<div class="fact"><span>${m.direction==="outgoing"?"Marcel":"Kontakt"}</span><b>${esc(m.text)}</b></div>`).join(""):'<div class="empty">Keine Aktivität vorhanden.</div>'}if(tab==="files")body='<div class="empty">Keine Dateiliste über die aktuelle Kontakt-API verfügbar.</div>';$("detail").innerHTML=`<div class="detail-head"><div class="avatar">👤</div><h2>${esc(name(c))}</h2><div class="small">${esc([c.city,c.country].filter(Boolean).join(", ")||"Kontakt")}</div></div><div class="detail-tabs">${tabs.map(t=>`<button class="${t===tab?"active":""}" data-tab="${t}">${labels[t]}</button>`).join("")}</div><div class="detail-body">${body}</div><a class="button edit" href="/Dashboard/?view=edit-contact&contact=${encodeURIComponent(c.id)}">Bearbeiten</a>`;$("detail").querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>renderDetail(button.dataset.tab))}
async function select(id){selected=id;renderList();$("detail").innerHTML='<div class="loading empty">Details werden geladen …</div>';try{detailData=await api(`/api/dashboard/contacts?id=${encodeURIComponent(id)}`);renderDetail()}catch(error){$("detail").innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
$("search").oninput=renderList;$("filters").onclick=event=>{const button=event.target.closest("[data-filter]");if(!button)return;filter=button.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===button));renderList()};document.querySelector(".platform-toggle").onclick=()=>document.querySelector(".platform-rail").classList.toggle("open");api("/api/dashboard/contacts").then(data=>{contacts=data.contacts||[];renderList();if(contacts[0])select(contacts[0].id)}).catch(error=>$("list").innerHTML=`<div class="loading empty">${esc(error.message)}</div>`);
</script></body></html>
