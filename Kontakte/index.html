const $=id=>document.getElementById(id),P=MarcelPresentation,esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let contacts=[],selected=null,filter="all",detail=null;const name=c=>c.name||c.displayName||c.whatsappDisplayName||"Unbekannter Kontakt";const channels=c=>{const set=new Set(),platforms=[c.sourcePlatform,c.currentPlatform].filter(Boolean).map(v=>String(v).toLowerCase());if(c.jid||c.whatsappJid||c.phoneNumber||c.whatsappUsername)set.add("whatsapp");for(const identity of c.identities||[])if(identity.channel)set.add(identity.channel);for(const p of platforms){if(p.includes("tinder"))set.add("tinder");if(p.includes("instagram"))set.add("instagram");if(p==="x"||p.includes("twitter"))set.add("x")}return [...set]};const last=c=>c.lastMessage?.text||c.lastMessageText||"Keine Nachricht";
const icons={whatsapp:'<path d="M12 2a9 9 0 0 0-7.7 13.7L3 21l5.4-1.3A9 9 0 1 0 12 2Zm4.8 12.8c-.2.6-1.2 1.1-1.7 1.2-.5.1-1.1.2-3.6-.8-3-1.2-4.9-4.3-5-4.5-.1-.2-1.2-1.6-1.2-3 0-1.5.8-2.2 1-2.5.3-.3.6-.3.8-.3h.6c.2 0 .5-.1.7.5l.9 2.1c.1.2.1.5 0 .7l-.5.8c-.2.2-.4.4-.2.7.2.3.8 1.3 1.8 2.1 1.2 1.1 2.2 1.4 2.5 1.6.3.1.5.1.7-.1l.9-1.1c.2-.3.5-.3.8-.2l2 .9c.3.1.6.2.7.4.1.1.1.7-.1 1.4Z"/>',tinder:'<path d="M13.8 2c.4 2.4-.6 4-1.8 5.1-.2-1.2-.8-2.3-1.8-3.1.1 2.5-1.6 3.9-3 5.4C5.9 10.8 5 12.3 5 14.5A7 7 0 0 0 19 14c0-4.2-2.3-8.8-5.2-12Z"/>',instagram:'<path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6ZM17.4 5.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/>',x:'<path d="M4 3h4.6l4.1 5.5L17.5 3H20l-6.2 7.3L20.5 21h-4.6l-4.6-6.1L6 21H3.5l6.7-7.9L4 3Zm3.4 2 9.7 14h1.8L9.2 5H7.4Z"/>',default:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 0 1 7.7 6H15a15 15 0 0 0-1.2-5.8C13.2 4.1 12.6 4 12 4Zm-1.8.2A15 15 0 0 0 9 10H4.3a8 8 0 0 1 5.9-5.8ZM4.3 12H9a15 15 0 0 0 1.2 5.8A8 8 0 0 1 4.3 12Zm9.5 5.8A15 15 0 0 0 15 12h4.7a8 8 0 0 1-5.9 5.8Z"/>'};
const channelIcon=channel=>`<span class="channel-icon ${esc(channel)}" title="${esc(P.channel(channel))}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[channel]||icons.default}</svg></span>`;
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{})},...options});if(r.status===401){location.href="/login.html";throw Error("Sitzung abgelaufen.")}const d=await r.json();if(!r.ok){const error=Error(d.error||"Kontakte konnten nicht geladen werden.");error.status=r.status;throw error}return d}
function shown(){const q=$("search").value.trim().toLowerCase();return contacts.filter(c=>(filter==="all"||channels(c).includes(filter))&&[name(c),c.city,c.country,c.phoneNumber,c.whatsappUsername,last(c)].filter(Boolean).join(" ").toLowerCase().includes(q)).sort((a,b)=>{const an=name(a).trim(),bn=name(b).trim();if(!an&&bn)return 1;if(an&&!bn)return -1;return an.localeCompare(bn,"de",{sensitivity:"base"})||String(a.id).localeCompare(String(b.id),"de",{numeric:true})})}
function renderList(){const rows=shown();$("count").textContent=`${contacts.length} Kontakte · ${rows.length} angezeigt`;$("list").innerHTML=rows.length?rows.map(c=>`<div class="row ${String(c.id)===String(selected)?"active":""}" data-id="${esc(c.id)}"><div class="avatar">👤</div><div><div class="name">${esc(name(c))}</div><div class="small">${esc([c.city,c.country].filter(Boolean).join(", ")||"Keine Ortsangabe")} · ${esc(P.status(c.contactStatus||c.platformStatus||"active"))}</div></div><div class="channels">${channels(c).map(channelIcon).join("")}</div><div><div class="small">${esc(P.dateTime(c.lastMessageAt))}</div><div class="small message-preview">${esc(last(c))}</div></div></div>`).join(""):'<div class="empty">Keine Kontakte für diesen Filter.</div>';$("list").querySelectorAll("[data-id]").forEach(row=>row.onclick=()=>select(row.dataset.id))}
const valueRows=v=>P.displayRows(v).map(r=>`<div class="value"><span>${esc(r.label)}</span><b>${esc(r.value)}</b></div>`).join("");
const topicPaths={"Persönlichkeit":'<circle cx="12" cy="8" r="4"/><path d="M5 21c.6-5 3-7 7-7s6.4 2 7 7"/>',"Kommunikation":'<path d="M4 5h16v11H9l-5 4V5Z"/>',"Beziehungen & Liebe":'<path d="M12 21S3 15 3 8.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9 2.5C21 15 12 21 12 21Z"/>',"Intimität":'<path d="m13 2-8 11h6l-1 9 9-12h-6V2Z"/>',"Familie":'<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c.5-4 2-6 5.5-6s5 2 5.5 6M13 15c3-1 6 .5 6.8 4"/>',"Arbeit & Alltag":'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18"/>'};
const topicIcon=topic=>`<span class="topic-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${topicPaths[topic]||'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'}</svg></span>`;
function identityRows(c){const identities=c.identities||[],editable=["tinder","instagram","x"];return `<div class="identity-list">${["whatsapp",...editable].map(channel=>{const item=identities.find(x=>x.channel===channel),connected=channel==="whatsapp"?(channels(c).includes("whatsapp")):Boolean(item),value=item?.displayValue||item?.value;return `<div class="identity-row">${channelIcon(channel)}<div><b>${esc(P.channel(channel))}</b><div class="small">${value?esc(value):connected?"✓ verbunden":"Nicht verbunden"}${item?.humanVerified?" · menschlich bestätigt":""}</div></div><div class="identity-actions">${channel==="whatsapp"?"":`<button data-identity-edit="${channel}">${item?"Bearbeiten":"＋ hinzufügen"}</button>${item?`<button data-identity-remove="${channel}">Entfernen</button>`:""}`}</div></div>`}).join("")}</div>`}
function brainGroups(){const items=[...(detail?.activeItems||[]).map(x=>({...x,presentationState:x.memoryType==="temporary_state"?"Temporär":"Aktiv"})),...(detail?.historicalItems||[]).map(x=>({...x,presentationState:"Historisch"}))],groups=new Map;for(const item of items){const topic=P.topic(item.category,item.key);groups.set(topic,[...(groups.get(topic)||[]),item])}return groups}
function cleanDetailRows(value){return P.displayRows(value).filter(row=>!/Year Inferred|Jahr Abgeleitet|Human Review|Source|Quelle|UPDATE3|Seed/i.test(`${row.label} ${row.value}`))}
function brainTopicList(groups){if(!groups.size)return '<div class="empty">Keine Woman-Brain-Fakten vorhanden.</div>';return `<div class="brain-topics">${[...groups].map(([topic,group])=>{const preview=P.semanticSummary(group,"Noch keine kurze Zusammenfassung verfügbar.");return `<button class="brain-topic-row ${detail?._activeTopic===topic?"active":""}" data-topic="${esc(topic)}">${topicIcon(topic)}<span class="topic-copy"><b>${esc(topic)}</b><small>${esc(preview)}</small></span><span>${group.length} ${group.length===1?"Fakt":"Fakten"} ›</span></button>`}).join("")}</div>`}
function brainTopicDetail(groups){const topic=detail?._activeTopic&&groups.has(detail._activeTopic)?detail._activeTopic:[...groups.keys()][0];if(!topic)return '<div class="empty">Kein Thema ausgewählt.</div>';detail._activeTopic=topic;const group=groups.get(topic),facts=P.semanticFacts(group),summary=P.semanticSummary(group,"Für dieses Thema liegt noch keine verlässliche Zusammenfassung vor.");return `<section class="topic-detail"><header>${topicIcon(topic)}<h3>${esc(topic)}</h3><span>${group.length} ${group.length===1?"Fakt":"Fakten"}</span></header><h4>Zusammenfassung</h4><p>${esc(summary)}</p><h4>Details</h4><ul>${facts.slice(0,8).map(fact=>`<li>${esc(fact.text)}</li>`).join("")}</ul>${group.some(x=>["confirmed","corrected"].includes(x.reviewStatus))?'<span class="authority">✓ Menschlich bestätigt</span>':""}<details class="details"><summary>Details anzeigen</summary>${group.map(item=>`<div class="values">${cleanDetailRows(item.value).map(row=>`<div class="value"><span>${esc(row.label)}</span><b>${esc(row.value)}</b></div>`).join("")}</div>`).join("")}</details></section>`}
function latestActivity(){const latest=[...(detail?.messages||[])].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0))[0];return latest?`<div class="last-activity">${channelIcon("whatsapp")}<div><b>WhatsApp</b><div class="small">${esc(P.dateTime(latest.createdAt))}</div><p class="message-preview">${esc(latest.translationDe||latest.translation_de||latest.text||"")}</p></div></div>`:'<div class="small">Keine Aktivität vorhanden.</div>'}
function relationshipSummary(){const items=(detail?.activeItems||[]).filter(item=>/relationship|interaction|shared|meaningful|connection/i.test(`${item.category} ${item.key}`)&&item.useInReply!==false);return P.semanticSummary(items,"Noch nicht genügend gemeinsame Interaktion für eine verlässliche Einschätzung.")}
function profileLeft(c){const activeItems=detail?.activeItems||[],aboutItems=activeItems.filter(item=>/personality|communication|lifestyle|profile|values/i.test(`${item.category} ${item.key}`)&&!/birth|age|year/i.test(`${item.category} ${item.key}`)&&item.useInReply!==false),about=P.humanProfileSummary(aboutItems,"Noch keine verlässliche persönliche Kurzbeschreibung vorhanden."),tension=P.tensionPresentation(activeItems,detail?.messages||[],detail?.events||[]);return `<div class="profile-left"><section class="profile-section"><h3>Über sie</h3><p>${esc(about)}</p></section><section class="profile-section"><h3>Letzte Aktivität</h3>${latestActivity()}</section><section class="profile-section"><h3>♡ Zwischen euch</h3><p>${esc(relationshipSummary())}</p></section><section class="profile-section tension"><h3>Flirt &amp; sexuelle Spannung</h3><span class="tension-level">${esc(tension.level)}</span><p>${esc(tension.summary)}</p></section><section class="profile-section identity-compact"><details><summary>Kanäle &amp; Profile verwalten</summary>${identityRows(c)}<div id="identityResult"></div></details></section><div class="channel-actions">${channels(c).map(channel=>`<a class="button channel-action" href="${{whatsapp:`/Dashboard/?contact=${encodeURIComponent(c.id)}`,tinder:"/Tinder/",instagram:"/Instagram/",x:"/X/"}[channel]}">${channelIcon(channel)} ${esc(P.channel(channel))} öffnen</a>`).join("")}</div></div>`}
function overview(c){const groups=brainGroups();return `<div class="reference-layout"><aside>${profileLeft(c)}</aside><section class="brain-center"><h3>Woman Brain</h3>${brainTopicList(groups)}</section><aside class="brain-right">${brainTopicDetail(groups)}</aside></div>`}
function brain(){const groups=brainGroups();return `<div class="brain-focus"><section class="brain-center"><h3>Woman Brain</h3>${brainTopicList(groups)}</section><aside class="brain-right">${brainTopicDetail(groups)}</aside></div>`}
function media(text){const s=String(text||"");if(/bild.+weggelassen|image omitted/i.test(s))return "Bild";if(/sticker.+weggelassen|sticker omitted/i.test(s))return "Sticker";if(/audio.+weggelassen|sprachnachricht|voice message/i.test(s))return "Sprachnachricht";return null}
function activity(){const messages=detail?.messages||[],events=detail?.events||[],mediaItems=detail?.mediaItems||[],preview=text=>String(text||"").replace(/\s+/g," ").slice(0,180),items=[...messages.map(m=>({at:m.createdAt||m.created_at||m.timestamp,actor:m.direction==="outgoing"?"Marcel":"Kontakt",channel:"WhatsApp",type:media(m.text)||(m.direction==="outgoing"?"Nachricht gesendet":"Nachricht erhalten"),text:media(m.text)?null:preview(m.translationDe||m.translation_de||m.text)})),...events.map(e=>({at:e.startedAt||e.createdAt,actor:"System",channel:P.channel(detail?.contact?.currentPlatform||"whatsapp"),type:P.label(e.type||e.subtype||"Ereignis"),text:preview(e.title||e.evidenceSummary)})),...mediaItems.map(m=>({at:m.capturedAt,actor:"Kontakt",channel:P.channel(m.channel),type:P.label(m.type),text:null,mediaId:m.id}))].sort((a,b)=>new Date(b.at||0)-new Date(a.at||0)).slice(0,20);return items.length?`<div class="timeline">${items.map(x=>`<article class="event" ${x.mediaId?`data-activity-media="${esc(x.mediaId)}"`:""}><div class="event-head"><b>${esc(x.actor)} · ${esc(x.channel)}</b><time>${esc(P.dateTime(x.at))}</time></div><div class="event-type">${esc(x.type)}</div>${x.text?`<div>„${esc(x.text)}${x.text.length===180?"…":""}“</div>`:""}</article>`).join("")}</div>`:'<div class="empty">Keine Aktivität vorhanden.</div>'}
function gallery(){const items=(detail?.mediaItems||[]).filter(x=>["photo","video","sticker"].includes(x.type));if(!items.length)return '<div class="empty">Noch keine Medien für diesen Kontakt.</div>';const types=[...new Set(items.map(x=>x.type))],sources=[...new Set(items.map(x=>x.channel))],filters=[["all","Alle"],...["photo","video","sticker"].filter(x=>types.includes(x)).map(x=>[x,{photo:"Fotos",video:"Videos",sticker:"Sticker"}[x]]),...["whatsapp","tinder","instagram"].filter(x=>sources.includes(x)).map(x=>[x,P.channel(x)])];return `<div class="media-filters">${filters.map(([key,label],i)=>`<button class="filter ${i===0?"active":""}" data-media-filter="${key}">${esc(label)}</button>`).join("")}</div><div class="gallery">${items.map(x=>`<article class="media-item" data-media-id="${esc(x.id)}" data-media-type="${esc(x.type)}" data-media-channel="${esc(x.channel)}"><div class="media-thumb">${x.thumbnailRef?`<img src="${esc(x.thumbnailRef)}" alt="">`:x.type==="video"?"▶":x.type==="sticker"?"✨":"🖼️"}</div><div class="media-info">${esc(P.channel(x.channel))} · ${esc(P.label(x.type))}<br>${esc(P.dateTime(x.capturedAt))}</div></article>`).join("")}</div>`}
function files(){const items=(detail?.mediaItems||[]).filter(x=>["document","file"].includes(x.type));return items.length?`<div class="cards">${items.map(x=>`<div class="fact"><b>${esc(x.metadata?.mimeType||"Datei")}</b><span>${esc(P.dateTime(x.capturedAt))}</span></div>`).join("")}</div>`:'<div class="empty">Keine Dateien für diesen Kontakt.</div>'}
function openMedia(id){const item=(detail?.mediaItems||[]).find(x=>String(x.id)===String(id));if(!item||!item.fileRef)return;const viewer=item.type==="video"?`<video src="${esc(item.fileRef)}" controls></video>`:`<img src="${esc(item.fileRef)}" alt="${esc(item.type)}">`;document.body.insertAdjacentHTML("beforeend",`<div class="lightbox" id="lightbox"><div class="lightbox-card">${viewer}<div class="media-info">${esc(P.channel(item.channel))} · ${esc(P.label(item.type))} · ${esc(P.dateTime(item.capturedAt))}</div></div></div>`);$("lightbox").onclick=e=>{if(e.target===$("lightbox"))e.currentTarget.remove()}}
function bindGallery(){const root=$("detail");root.querySelectorAll("[data-media-filter]").forEach(button=>button.onclick=()=>{root.querySelectorAll("[data-media-filter]").forEach(x=>x.classList.toggle("active",x===button));root.querySelectorAll("[data-media-id]").forEach(item=>item.hidden=button.dataset.mediaFilter!=="all"&&button.dataset.mediaFilter!==item.dataset.mediaType&&button.dataset.mediaFilter!==item.dataset.mediaChannel)});root.querySelectorAll("[data-media-id]").forEach(item=>item.onclick=()=>openMedia(item.dataset.mediaId));root.querySelectorAll("[data-activity-media]").forEach(item=>item.onclick=()=>{const id=item.dataset.activityMedia;renderDetail("gallery");openMedia(id)})}
async function editIdentity(channel){const current=(detail?.identities||[]).find(x=>x.channel===channel),value=prompt(`${P.channel(channel)} Identifier`,current?.value||"");if(value===null)return;try{await api(`/api/dashboard/contacts?id=${encodeURIComponent(selected)}&resource=identities`,{method:"POST",body:JSON.stringify({channel,value})});detail=await api(`/api/dashboard/contacts?id=${encodeURIComponent(selected)}`);contacts=contacts.map(c=>String(c.id)===String(selected)?{...c,identities:detail.identities}:c);renderDetail("overview");renderList()}catch(error){const box=$("identityResult");if(box)box.innerHTML=`<div class="notice">${esc(error.message)}</div>`}}
async function removeIdentity(channel){if(!confirm(`${P.channel(channel)} aus diesem Profil entfernen?`))return;try{await api(`/api/dashboard/contacts?id=${encodeURIComponent(selected)}&resource=identities`,{method:"DELETE",body:JSON.stringify({channel})});detail=await api(`/api/dashboard/contacts?id=${encodeURIComponent(selected)}`);contacts=contacts.map(c=>String(c.id)===String(selected)?{...c,identities:detail.identities}:c);renderDetail("overview");renderList()}catch(error){const box=$("identityResult");if(box)box.innerHTML=`<div class="notice">${esc(error.message)}</div>`}}
function renderDetail(tab="overview"){const source=detail?.contact||contacts.find(x=>String(x.id)===String(selected));if(!source)return closeProfile();const c={...source,identities:detail?.identities||source.identities||[]},tabs={overview:"Übersicht",brain:"Woman Brain",activity:"Aktivität",gallery:"Galerie",files:"Dateien"},body=tab==="overview"?overview(c):tab==="brain"?brain():tab==="activity"?activity():tab==="gallery"?gallery():files(),links={whatsapp:`/Dashboard/?contact=${encodeURIComponent(c.id)}`,tinder:"/Tinder/",instagram:"/Instagram/",x:"/X/"},photo=c.profilePhotoUrl||c.profilePhoto||null,subtitle=[[c.city,c.country].filter(Boolean).join(", "),c.age?`${c.age} Jahre`:""].filter(Boolean).join(" · ");$("detail").innerHTML=`<div class="detail-shell"><div class="detail-head"><div class="avatar">${photo?`<img src="${esc(photo)}" alt="">`:"👤"}</div><div><h2>${esc(name(c))}</h2><div class="small">${esc(subtitle||"Kontakt")}</div><div class="channels">${channels(c).map(channelIcon).join("")}</div></div><div class="profile-actions"><a class="button" href="/Dashboard/?view=edit-contact&contact=${encodeURIComponent(c.id)}">Bearbeiten</a><button class="button close" id="closeProfile">Schließen</button></div></div><div class="channel-actions">${channels(c).map(channel=>`<a class="button channel-action" href="${links[channel]}">${channelIcon(channel)} ${esc(P.channel(channel))} öffnen</a>`).join("")}</div><div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="${k===tab?"active":""}" data-tab="${k}">${v}</button>`).join("")}</div><div class="body">${body}</div></div>`;$("detail").classList.add("open");$("closeProfile").onclick=closeProfile;$("detail").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>renderDetail(b.dataset.tab));$("detail").querySelectorAll("[data-identity-edit]").forEach(b=>b.onclick=()=>editIdentity(b.dataset.identityEdit));$("detail").querySelectorAll("[data-identity-remove]").forEach(b=>b.onclick=()=>removeIdentity(b.dataset.identityRemove));bindGallery()}
function closeProfile(){$("detail").classList.remove("open");$("detail").innerHTML="";selected=null;detail=null;renderList()}
async function select(id){selected=id;renderList();$("detail").innerHTML='<div class="loading">Details werden geladen …</div>';try{detail=await api(`/api/dashboard/contacts?id=${encodeURIComponent(id)}`);renderDetail()}catch(e){$("detail").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$("search").oninput=renderList;$("filters").onclick=e=>{const b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderList()};$("detail").onclick=e=>{if(e.target===$("detail"))return closeProfile();const topic=e.target.closest("[data-topic]");if(topic&&detail){detail._activeTopic=topic.dataset.topic;renderDetail($("detail").querySelector("[data-tab].active")?.dataset.tab||"overview")}};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("detail").classList.contains("open"))closeProfile()});document.querySelector(".platform-toggle").onclick=()=>document.querySelector(".platform-rail").classList.toggle("open");api("/api/dashboard/contacts").then(d=>{contacts=d.contacts||[];renderList()}).catch(e=>$("list").innerHTML=`<div class="empty">${esc(e.message)}</div>`);
</script></body></html>
