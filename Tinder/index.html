<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Marcel AI | Tinder</title>
  <link rel="stylesheet" href="/platform.css">
  <style>
    :root{--accent:#ff5d70;--active-bg:#2a171b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-height:156px}.card h2{margin:0 0 14px;font-size:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="platform-layout">
    <aside class="platform-rail">
      <div class="platform-brand">MARCEL <span>AI</span></div>
      <button class="platform-toggle">Menü</button>
      <nav class="platform-nav">
        <a href="/Hub/">Hub</a>
        <a href="/Dashboard/">WhatsApp</a>
        <a class="active" href="/Tinder/">Tinder</a>
        <a href="/Instagram/">Instagram</a>
        <a href="/X/">X (Twitter)</a>
        <a href="/Brain/">Brain</a>
        <a href="/Trading/">Trading</a>
        <div class="platform-secondary">
          <a href="/Kontakte/">Kontakte</a>
          <a href="/Analyse/">Analyse</a>
          <a href="/Einstellungen/">Einstellungen</a>
        </div>
      </nav>
    </aside>
    <main class="platform-main">
      <div class="platform-wrap">
        <header class="page-head">
          <div>
            <div class="eyebrow">Tinder</div>
            <h1>Tinder</h1>
            <div class="muted">Noch keine Produktdaten verfügbar.</div>
          </div>
        </header>
        <section class="grid">
          <article class="card"><h2>Matches</h2><div class="empty">Keine Daten verfügbar.</div></article>
          <article class="card"><h2>Conversations</h2><div class="empty">Keine Daten verfügbar.</div></article>
          <article class="card"><h2>Chat</h2><div class="empty">Keine Daten verfügbar.</div></article>
          <article class="card"><h2>Profil</h2><div class="empty">Keine Daten verfügbar.</div></article>
        </section>
      </div>
    </main>
  </div>
  <script>document.querySelector(".platform-toggle").onclick=()=>document.querySelector(".platform-rail").classList.toggle("open")</script>
</body>
</html>
