<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Marcel AI | Tinder</title>
  <link rel="stylesheet" href="/platform.css">
  <style>
    :root{--accent:#ff5d70;--active-bg:#2a171b}.tinder-grid{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(280px,1.35fr) minmax(220px,.8fr);gap:14px;align-items:start}.tinder-card{min-height:220px}.tinder-card h2{margin:0 0 14px;font-size:15px}.tinder-list{display:grid;gap:8px}.tinder-item{width:100%;border:1px solid #30363d;border-radius:10px;background:#171a1f;color:inherit;padding:10px;text-align:left;cursor:pointer}.tinder-item:hover,.tinder-item[aria-current="true"]{border-color:var(--accent);background:#2a171b}.tinder-title{display:block;font-weight:700}.tinder-meta{display:block;margin-top:4px;font-size:12px;color:#98a2b3}.tinder-match-link{border:0;background:transparent;padding:0;text-decoration:underline;cursor:pointer}.tinder-messages{display:grid;gap:9px;max-height:560px;overflow:auto}.tinder-message{border-left:3px solid #56606d;padding:7px 9px;background:#171a1f;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}.tinder-message.outbound{border-left-color:var(--accent)}.tinder-message-meta{font-size:11px;color:#98a2b3;margin-bottom:3px}.tinder-profile{display:grid;gap:14px}.tinder-profile-header{font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}.tinder-profile-section{border-top:1px solid #30363d;padding-top:13px}.tinder-profile-section h3{margin:0 0 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98a2b3}.tinder-profile-prose{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.tinder-profile-facts{display:grid;gap:10px}.tinder-profile-fact{display:grid;grid-template-columns:minmax(92px,.8fr) minmax(0,1.2fr);gap:10px;align-items:start}.tinder-profile-fact-label{color:#98a2b3}.tinder-profile-fact-value{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.tinder-profile-chips{display:flex;flex-wrap:wrap;gap:6px}.tinder-profile-chip{border:1px solid #30363d;border-radius:999px;background:#171a1f;padding:5px 8px;font-size:12px;line-height:1.3;overflow-wrap:anywhere}.tinder-profile-fallback{color:#c9d0d8}.tinder-media{margin:12px 0 0;padding-left:18px;overflow-wrap:anywhere}.tinder-status{min-height:20px}.tinder-status.error{color:#ff8d9a}@media(max-width:1000px){.tinder-grid{grid-template-columns:1fr 1fr}.tinder-card.chat,.tinder-card.profile-card{grid-column:span 2}}@media(max-width:680px){.tinder-grid{grid-template-columns:1fr}.tinder-card.chat,.tinder-card.profile-card{grid-column:auto}.tinder-profile-fact{grid-template-columns:1fr;gap:3px}}
  </style>
</head>
<body>
  <div class="platform-layout">
    <aside class="platform-rail">
      <div class="platform-brand">MARCEL <span>AI</span></div>
      <button class="platform-toggle">Menü</button>
      <nav class="platform-nav">
        <a href="/Hub/">Hub</a>
        <a href="/Dashboard/">WhatsApp</a>
        <a class="active" href="/Tinder/">Tinder</a>
        <a href="/Instagram/">Instagram</a>
        <a href="/X/">X (Twitter)</a>
        <a href="/Brain/">Brain</a>
        <a href="/Trading/">Trading</a>
        <div class="platform-secondary">
          <a href="/Kontakte/">Kontakte</a>
          <a href="/Analyse/">Analyse</a>
          <a href="/Einstellungen/">Einstellungen</a>
        </div>
      </nav>
    </aside>
    <main class="platform-main">
      <div class="platform-wrap">
        <header class="page-head">
          <div>
            <div class="eyebrow">Tinder</div>
            <h1>Tinder</h1>
            <div id="tinder-status" class="muted tinder-status" aria-live="polite">Conversations werden geladen …</div>
          </div>
        </header>
        <section class="tinder-grid" aria-label="Tinder-Produktdaten">
          <article class="card tinder-card">
            <h2>Conversations</h2>
            <div id="tinder-conversations" class="tinder-list" data-tinder-conversations></div>
          </article>
          <article class="card tinder-card chat">
            <h2>Chat</h2>
            <div id="tinder-chat" class="tinder-messages" data-tinder-chat></div>
          </article>
          <article class="card tinder-card profile-card">
            <h2>Profil</h2>
            <div id="tinder-profile" class="tinder-profile" data-tinder-profile></div>
          </article>
          <article class="card tinder-card">
            <h2>Matches</h2>
            <div id="tinder-matches" class="tinder-list" data-tinder-matches></div>
          </article>
        </section>
      </div>
    </main>
  </div>
  <script>
    const conversationsNode = document.getElementById("tinder-conversations");
    const chatNode = document.getElementById("tinder-chat");
    const profileNode = document.getElementById("tinder-profile");
    const matchesNode = document.getElementById("tinder-matches");
    const statusNode = document.getElementById("tinder-status");
    let selectedConversationId = null;

    document.querySelector(".platform-toggle").onclick = () => document.querySelector(".platform-rail").classList.toggle("open");

    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function empty(node, message) { clear(node); const element = document.createElement("div"); element.className = "empty"; element.textContent = message; node.append(element); }
    function formatDate(value) { if (!value) return "Noch nicht synchronisiert"; const date = new Date(value); return Number.isNaN(date.valueOf()) ? "Noch nicht synchronisiert" : date.toLocaleString("de-DE"); }
    function setStatus(message, error = false) { statusNode.textContent = message; statusNode.classList.toggle("error", error); }
    // Existing product rows can predate the raw UiAutomator2 entity decoder.
    // Decode them once in an inert document and still insert only text nodes.
    function decodeStoredTinderText(value) {
      const source = value === undefined || value === null ? "" : String(value);
      if (!source.includes("&")) return source;
      const escapedMarkup = source.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      const parsed = new DOMParser().parseFromString(escapedMarkup, "text/html");
      return parsed.body?.textContent ?? source;
    }
    function profileName(conversation) { return decodeStoredTinderText(conversation?.profile?.display_name) || "Unbenannte Conversation"; }

    function orderedProfileValues(attributes, expression) {
      return Object.entries(attributes || {})
        .map(([key, value]) => ({ match: expression.exec(key), value }))
        .filter(({ match, value }) => match && typeof value === "string" && value.trim())
        .sort((left, right) => Number(left.match[1]) - Number(right.match[1]))
        .map(({ value }) => decodeStoredTinderText(value));
    }

    function normalizedProfileValue(value) {
      return String(value || "").normalize("NFC").trim();
    }

    function profilePresentation(attributes) {
      const entries = Object.entries(attributes || {});
      const rawValues = orderedProfileValues(attributes, /^visible_profile_(\d{2})$/);
      const sections = orderedProfileValues(attributes, /^profile_section_(\d{2})$/)
        .map((title) => ({ title, rawIndex: rawValues.findIndex((value) => normalizedProfileValue(value) === normalizedProfileValue(title)), facts: [], prose: [], chips: [] }));
      const fields = new Map();
      for (const [key, value] of entries) {
        const match = /^structured_profile_(\d{2})_(label|value)$/.exec(key);
        if (!match || typeof value !== "string") continue;
        const field = fields.get(match[1]) || {};
        field[match[2]] = decodeStoredTinderText(value);
        fields.set(match[1], field);
      }
      const pairs = [...fields.entries()]
        .sort(([left], [right]) => left.localeCompare(right))
        .flatMap(([, field]) => normalizedProfileValue(field.label) && normalizedProfileValue(field.value)
          ? [{ label: field.label, value: field.value }]
          : []);
      const chips = orderedProfileValues(attributes, /^profile_chip_(\d{2})$/);
      const chipValues = new Set(chips.map(normalizedProfileValue));
      const fieldValues = new Set();
      const fieldLabels = new Set();
      const profileSection = { title: null, rawIndex: -1, facts: [], prose: [], chips: [] };
      const groups = sections.length ? sections : [profileSection];

      function groupFor(value, fallback = groups[0]) {
        const position = rawValues.findIndex((candidate) => normalizedProfileValue(candidate) === normalizedProfileValue(value));
        if (position < 0) return fallback;
        return groups.filter((group) => group.rawIndex >= 0 && group.rawIndex <= position).at(-1) || fallback;
      }

      for (const pair of pairs) {
        const group = groupFor(pair.label);
        const label = normalizedProfileValue(pair.label);
        const value = normalizedProfileValue(pair.value);
        fieldLabels.add(label);
        fieldValues.add(value);
        if (label === normalizedProfileValue(group.title)) {
          if (!chipValues.has(value) && !group.prose.some((item) => normalizedProfileValue(item) === value)) group.prose.push(pair.value);
        } else if (!chipValues.has(value)) {
          group.facts.push(pair);
        }
      }

      for (const value of rawValues) {
        const normalized = normalizedProfileValue(value);
        if (!normalized || chipValues.has(normalized) || fieldLabels.has(normalized) || fieldValues.has(normalized)
          || groups.some((group) => normalizedProfileValue(group.title) === normalized)) continue;
        const group = groupFor(value);
        if (!group.prose.some((item) => normalizedProfileValue(item) === normalized)) group.prose.push(value);
      }

      if (chips.length) {
        const group = groupFor(chips[0], groups.at(-1));
        group.chips = chips;
      }

      const age = entries.find(([key, value]) => key === "header_profile_age" && typeof value === "string" && value.trim())?.[1];
      return {
        age: age ? decodeStoredTinderText(age) : null,
        groups: groups.filter((group) => group.facts.length || group.prose.length || group.chips.length)
      };
    }

    function renderConversationList(conversations) {
      clear(conversationsNode);
      if (!conversations.length) {
        empty(conversationsNode, "Noch keine Conversations synchronisiert.");
        return;
      }
      for (const conversation of conversations) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "tinder-item";
        item.dataset.conversationId = conversation.id;
        item.setAttribute("aria-current", String(conversation.id === selectedConversationId));
        const title = document.createElement("span");
        title.className = "tinder-title";
        title.textContent = profileName(conversation);
        const meta = document.createElement("span");
        meta.className = "tinder-meta";
        meta.textContent = `${conversation.message_count || 0} Nachrichten · ${conversation.history_complete ? "History vollständig" : "History offen"}`;
        item.append(title, meta);
        item.addEventListener("click", () => loadConversation(conversation.id));
        conversationsNode.append(item);
      }
    }

    function matchName(match) { return decodeStoredTinderText(match?.tile?.display_name) || "Unbenanntes Match"; }

    function renderMatches(matches) {
      clear(matchesNode);
      if (!matches.length) {
        empty(matchesNode, "Noch keine Matches synchronisiert.");
        return;
      }
      for (const match of matches) {
        const item = document.createElement("article");
        item.className = "tinder-item";
        const title = document.createElement("span");
        title.className = "tinder-title";
        title.textContent = matchName(match);
        const meta = document.createElement(match.conversation_id ? "button" : "span");
        meta.className = "tinder-meta";
        const position = Number.isInteger(match.carousel_position) ? match.carousel_position + 1 : "–";
        meta.textContent = `Karussell ${position} · ${match.conversation_id ? "Conversation verknüpft" : "Noch keine Conversation"}`;
        if (match.conversation_id) {
          meta.type = "button";
          meta.classList.add("tinder-match-link");
          meta.addEventListener("click", () => loadConversation(match.conversation_id));
        }
        item.append(title, meta);
        for (const value of Object.values(match?.tile?.attributes || {})) {
          const detail = document.createElement("span");
          detail.className = "tinder-meta";
          detail.textContent = decodeStoredTinderText(value);
          item.append(detail);
        }
        matchesNode.append(item);
      }
    }

    async function loadMatches() {
      try {
        const response = await fetch("/api/dashboard/tinder?resource=matches", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || !data?.ok) throw new Error(data?.error || "Matches konnten nicht geladen werden.");
        renderMatches(Array.isArray(data.matches) ? data.matches : []);
      } catch {
        empty(matchesNode, "Matches sind momentan nicht verfügbar.");
      }
    }

    function renderDetail(data) {
      clear(chatNode);
      clear(profileNode);
      const messages = Array.isArray(data.messages) ? data.messages : [];
      if (!messages.length) empty(chatNode, "Keine sichtbaren Nachrichten gespeichert.");
      for (const message of messages) {
        const row = document.createElement("article");
        row.className = `tinder-message ${message.direction === "OUTBOUND" ? "outbound" : "inbound"}`;
        const meta = document.createElement("div");
        meta.className = "tinder-message-meta";
        const visibleTime = decodeStoredTinderText(message.visible_time);
        const visibleStatus = decodeStoredTinderText(message.visible_status);
        meta.textContent = [
          message.direction === "OUTBOUND" ? "Ausgehend" : "Eingehend",
          ...(visibleTime ? [visibleTime] : []),
          ...(visibleStatus ? [visibleStatus] : [])
        ].join(` ${String.fromCodePoint(0x00b7)} `);
        const text = document.createElement("div");
        text.textContent = decodeStoredTinderText(message.text);
        row.append(meta, text);
        chatNode.append(row);
      }
      const profile = data.conversation?.profile || {};
      const presentation = profilePresentation(profile.attributes);
      const header = document.createElement("div");
      header.className = "tinder-profile-header";
      const profileHeader = [
        decodeStoredTinderText(profile.display_name),
        presentation.age
      ].filter((value) => normalizedProfileValue(value));
      header.textContent = profileHeader.join(` ${String.fromCodePoint(0x00b7)} `) || String.fromCodePoint(0x2013);
      profileNode.append(header);
      for (const group of presentation.groups) {
        const section = document.createElement("section");
        section.className = "tinder-profile-section";
        if (normalizedProfileValue(group.title)) {
          const heading = document.createElement("h3");
          heading.textContent = group.title;
          section.append(heading);
        }
        if (group.prose.length) {
          const prose = document.createElement("p");
          prose.className = "tinder-profile-prose tinder-profile-fallback";
          prose.textContent = group.prose.join("\n\n");
          section.append(prose);
        }
        if (group.facts.length) {
          const facts = document.createElement("div");
          facts.className = "tinder-profile-facts";
          for (const fact of group.facts) {
            const row = document.createElement("div");
            row.className = "tinder-profile-fact";
            const label = document.createElement("div");
            label.className = "tinder-profile-fact-label";
            label.textContent = fact.label;
            const value = document.createElement("div");
            value.className = "tinder-profile-fact-value";
            value.textContent = fact.value;
            row.append(label, value);
            facts.append(row);
          }
          section.append(facts);
        }
        if (group.chips.length) {
          const chips = document.createElement("div");
          chips.className = "tinder-profile-chips";
          for (const chipValue of group.chips) {
            const chip = document.createElement("span");
            chip.className = "tinder-profile-chip";
            chip.textContent = chipValue;
            chips.append(chip);
          }
          section.append(chips);
        }
        profileNode.append(section);
      }
      if (Array.isArray(profile.media_refs) && profile.media_refs.length) {
        const media = document.createElement("ul"); media.className = "tinder-media";
        for (const reference of profile.media_refs) {
          const item = document.createElement("li"); item.textContent = reference; media.append(item);
        }
        profileNode.append(media);
      }
    }

    async function loadConversation(id) {
      selectedConversationId = id;
      setStatus("Conversation wird geladen …");
      try {
        const response = await fetch(`/api/dashboard/tinder?id=${encodeURIComponent(id)}`, { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || !data?.ok) throw new Error(data?.error || "Conversation konnte nicht geladen werden.");
        renderDetail(data);
        document.querySelectorAll("[data-conversation-id]").forEach((item) => item.setAttribute("aria-current", String(item.dataset.conversationId === selectedConversationId)));
        setStatus(`Letzte Synchronisierung: ${formatDate(data.conversation?.history_synced_at)}`);
      } catch (error) {
        setStatus(error.message || "Conversation konnte nicht geladen werden.", true);
      }
    }

    async function loadConversations() {
      try {
        await loadMatches();
        const response = await fetch("/api/dashboard/tinder", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || !data?.ok) throw new Error(data?.error || "Tinder-Daten konnten nicht geladen werden.");
        const conversations = Array.isArray(data.conversations) ? data.conversations : [];
        renderConversationList(conversations);
        if (!conversations.length) {
          empty(chatNode, "Wähle nach der ersten Synchronisierung eine Conversation.");
          empty(profileNode, "Noch kein Profil gespeichert.");
          setStatus("Noch keine Conversations synchronisiert.");
          return;
        }
        await loadConversation(conversations.find((item) => item.id === selectedConversationId)?.id || conversations[0].id);
      } catch (error) {
        empty(conversationsNode, "Tinder-Daten sind momentan nicht verfügbar.");
        empty(chatNode, "Keine Chatdaten verfügbar.");
        empty(profileNode, "Keine Profildaten verfügbar.");
        setStatus(error.message || "Tinder-Daten konnten nicht geladen werden.", true);
      }
    }

    loadConversations();
  </script>
</body>
</html>
