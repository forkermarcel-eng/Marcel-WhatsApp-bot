<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Marcel Marlow</title>
  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 25%, #1d2730 0%, #0d1217 38%, #050709 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    .logo span {
      color: #42c763;
    }

    .login-box {
      background: rgba(13, 18, 23, 0.88);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 38px 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      backdrop-filter: blur(15px);
    }

    .login-box h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-box .subtitle {
      text-align: center;
      color: #8e989f;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #c5ccd1;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 50px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.055);
      color: #ffffff;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #42c763;
      box-shadow: 0 0 0 3px rgba(66,199,99,0.1);
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 9px;
      background: #42c763;
      color: #071009;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      background: #4ed26e;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 70, 70, 0.1);
      border: 1px solid rgba(255, 70, 70, 0.25);
      color: #ff8585;
      font-size: 13px;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #7f8990;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      MARCEL <span>MARLOW</span>
    </div>

    <div class="login-box">

      <h1>Dashboard Login</h1>

      <p class="subtitle">
        Bitte anmelden, um fortzufahren.
      </p>

      <form id="loginForm">

        <div class="form-group">
          <label for="username">Benutzername</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Passwort</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton">
          Einloggen
        </button>

        <div class="error" id="errorMessage"></div>

      </form>

    </div>

    <a href="/" class="back">
      ← Zurück zur Website
    </a>

  </div>


  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      errorMessage.style.display = "none";
      errorMessage.textContent = "";

      button.disabled = true;
      button.textContent = "Anmeldung läuft...";

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(
            data.error || "Anmeldung fehlgeschlagen."
          );
        }

        window.location.href = "/Dashboard/";

      } catch (error) {
        errorMessage.textContent =
          error.message || "Anmeldung fehlgeschlagen.";

        errorMessage.style.display = "block";

        button.disabled = false;
        button.textContent = "Einloggen";
      }
    });
  </script>

</body>
</html>
